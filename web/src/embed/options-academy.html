166\" fill=\"#8593a1\" font-size=\"9\" font-family=\"monospace\" text-anchor=\"end\">−</text><text x=\"177\" y=\"192\" fill=\"#8593a1\" font-size=\"9\" font-family=\"monospace\" text-anchor=\"middle\">underlying price →</text></svg>","options":["Long call","Long straddle","Covered call","Iron condor"],"correct_index":1,"why":"A V-shape: max loss at the strike, profit if price moves FAR either direction past the combined premium. A volatility bet = long straddle (long call + long put, same strike).","tags":["payoff","visual","long-straddle"]},{"id":"opt-107","module":"payoff","level":2,"question":"Which strategy does this expiration payoff diagram show?","svg":"<svg viewBox=\"0 0 320 196\" width=\"100%\" role=\"img\" aria-label=\"payoff diagram\" style=\"max-width:340px;display:block;margin:2px auto 0;background:rgba(7,11,16,.5);border:1px solid #27323f;border-radius:8px\"><line x1=\"50\" y1=\"22\" x2=\"50\" y2=\"166\" stroke=\"#324252\" stroke-width=\"1\"/><line x1=\"50\" y1=\"72.4\" x2=\"304\" y2=\"72.4\" stroke=\"#56657a\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><line x1=\"141.7\" y1=\"22\" x2=\"141.7\" y2=\"166\" stroke=\"#324252\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"212.3\" y1=\"22\" x2=\"212.3\" y2=\"166\" stroke=\"#324252\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><polyline points=\"50.0,150.2 53.2,146.4 56.3,142.5 59.5,138.6 62.7,134.7 65.9,130.8 69.1,126.9 72.2,123.0 75.4,119.1 78.6,115.2 81.8,111.3 84.9,107.4 88.1,103.5 91.3,99.6 94.4,95.7 97.6,91.8 100.8,87.9 104.0,84.0 107.2,80.2 110.3,76.3 113.5,72.4 116.7,68.5 119.8,64.6 123.0,60.7 126.2,56.8 129.4,52.9 132.6,49.0 135.7,45.1 138.9,41.2 142.1,37.8 145.2,37.8 148.4,37.8 151.6,37.8 154.8,37.8 157.9,37.8 161.1,37.8 164.3,37.8 167.5,37.8 170.7,37.8 173.8,37.8 177.0,37.8 180.2,37.8 183.3,37.8 186.5,37.8 189.7,37.8 192.9,37.8 196.1,37.8 199.2,37.8 202.4,37.8 205.6,37.8 208.8,37.8 211.9,37.8 215.1,41.2 218.3,45.1 221.4,49.0 224.6,52.9 227.8,56.8 231.0,60.7 234.2,64.6 237.3,68.5 240.5,72.4 243.7,76.3 246.8,80.2 250.0,84.0 253.2,87.9 256.4,91.8 259.6,95.7 262.7,99.6 265.9,103.5 269.1,107.4 272.2,111.3 275.4,115.2 278.6,119.1 281.8,123.0 284.9,126.9 288.1,130.8 291.3,134.7 294.5,138.6 297.6,142.5 300.8,146.4 304.0,150.2\" fill=\"none\" stroke=\"#36d6e7\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"47\" y=\"26\" fill=\"#8593a1\" font-size=\"9\" font-family=\"monospace\" text-anchor=\"end\">+P/L</text><text x=\"47\" y=\"166\" fill=\"#8593a1\" font-size=\"9\" font-family=\"monospace\" text-anchor=\"end\">−</text><text x=\"177\" y=\"192\" fill=\"#8593a1\" font-size=\"9\" font-family=\"monospace\" text-anchor=\"middle\">underlying price →</text></svg>","options":["Long straddle","Iron condor","Bull call spread","Covered call"],"correct_index":1,"why":"A tent: flat capped profit while price stays in the middle range, capped losses at both wings. A defined-risk, range-bound, theta-positive trade = an iron condor.","tags":["payoff","visual","iron-condor"]},{"id":"opt-108","module":"payoff","level":2,"question":"Which strategy does this expiration payoff diagram show?","svg":"<svg viewBox=\"0 0 320 196\" width=\"100%\" role=\"img\" aria-label=\"payoff diagram\" style=\"max-width:340px;display:block;margin:2px auto 0;background:rgba(7,11,16,.5);border:1px solid #27323f;border-radius:8px\"><line x1=\"50\" y1=\"22\" x2=\"50\" y2=\"166\" stroke=\"#324252\" stroke-width=\"1\"/><line x1=\"50\" y1=\"82.8\" x2=\"304\" y2=\"82.8\" stroke=\"#56657a\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><line x1=\"127.0\" y1=\"22\" x2=\"127.0\" y2=\"166\" stroke=\"#324252\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><line x1=\"203.9\" y1=\"22\" x2=\"203.9\" y2=\"166\" stroke=\"#324252\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><polyline points=\"50.0,37.8 53.2,37.8 56.4,37.8 59.5,37.8 62.7,37.8 65.9,37.8 69.1,37.8 72.2,37.8 75.4,37.8 78.6,37.8 81.8,37.8 84.9,37.8 88.1,37.8 91.3,37.8 94.4,37.8 97.6,37.8 100.8,37.8 104.0,37.8 107.1,37.8 110.3,37.8 113.5,37.8 116.7,37.8 119.9,37.8 123.0,37.8 126.2,37.8 129.4,41.3 132.6,45.9 135.7,50.5 138.9,55.2 142.1,59.8 145.2,64.5 148.4,69.1 151.6,73.8 154.8,78.4 157.9,83.0 161.1,87.7 164.3,92.3 167.5,97.0 170.6,101.6 173.8,106.2 177.0,110.9 180.2,115.5 183.4,120.2 186.5,124.8 189.7,129.4 192.9,134.1 196.1,138.7 199.2,143.4 202.4,148.0 205.6,150.2 208.8,150.2 211.9,150.2 215.1,150.2 218.3,150.2 221.4,150.2 224.6,150.2 227.8,150.2 231.0,150.2 234.1,150.2 237.3,150.2 240.5,150.2 243.7,150.2 246.9,150.2 250.0,150.2 253.2,150.2 256.4,150.2 259.6,150.2 262.7,150.2 265.9,150.2 269.1,150.2 272.2,150.2 275.4,150.2 278.6,150.2 281.8,150.2 285.0,150.2 288.1,150.2 291.3,150.2 294.5,150.2 297.6,150.2 300.8,150.2 304.0,150.2\" fill=\"none\" stroke=\"#36d6e7\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"47\" y=\"26\" fill=\"#8593a1\" font-size=\"9\" font-family=\"monospace\" text-anchor=\"end\">+P/L</text><text x=\"47\" y=\"166\" fill=\"#8593a1\" font-size=\"9\" font-family=\"monospace\" text-anchor=\"end\">−</text><text x=\"177\" y=\"192\" fill=\"#8593a1\" font-size=\"9\" font-family=\"monospace\" text-anchor=\"middle\">underlying price →</text></svg>","options":["Bull call spread","Bear put (debit) spread","Long call","Short put"],"correct_index":1,"why":"Mirror of the bull call spread: flat capped GAIN below the lower strike, a ramp down between strikes, flat loss above the upper strike. Profits as the stock falls, defined both ways = a bear put spread.","tags":["payoff","visual","bear-put-(debit)-spread"]},{"id":"opt-109","module":"vol-edge","level":2,"question":"SPY is $745 and the at-the-money straddle (ATM call + ATM put, same expiry) costs $8.00. What is that $8 actually telling you?","options":["The stock will definitely move $8","The market's EXPECTED move by expiry is ~$8 (≈1.1%) in EITHER direction","You'll make $8 if you buy it","The maximum the stock can move is $8"],"correct_index":1,"why":"The ATM straddle price IS the market's expected (1-sigma-ish) move. $8 on $745 ≈ 1.1%. This is the single most important number in vol trading: every straddle decision reduces to 'is that expected move CHEAP or RICH versus how this stock actually moves?' It's a probability, not a promise — the stock can move far more or far less.","tags":["expected-move","straddle","core"],"rh_note":"Before you ever buy a straddle, read the ATM straddle price first — that's the bar your move has to clear just to break even."},{"id":"opt-110","module":"vol-edge","level":2,"question":"You buy that $8.00 SPY straddle. At expiration, where do you actually make money?","options":["Anywhere the stock moves at all","Only if SPY moves MORE than $8 (above $753 or below $737)","Only if SPY goes up","As long as IV stays the same"],"correct_index":1,"why":"A long straddle's breakevens are strike ± debit: 745 ± 8 = 737 and 753. The stock must move MORE than the expected move you paid for. This is why 'buying a straddle because a big move is coming' usually loses — the big move is already priced in. You need a move bigger than the one everyone agrees on.","tags":["breakeven","expected-move","straddle"]},{"id":"opt-111","module":"vol-edge","level":2,"question":"A stock's options show IV = 18% while its recent realized (historical) volatility is HV = 26%. IV/HV = 0.69. What does that say?","options":["Vol is RICH — sell premium","Vol is CHEAP — the move is underpriced vs how the stock actually moves (a buyer's setup)","Nothing — IV and HV are unrelated","The stock is about to crash"],"correct_index":1,"why":"IV/HV below ~0.85 = the market is pricing LESS movement than the stock has actually been delivering → options are cheap → favors the BUYER. Above ~1.20 = rich → favors the SELLER. This ratio is the engine's primary cheap/rich gate (straddle_engine IV_RV_CHEAP=0.85, IV_RV_RICH=1.20). Cheap vol alone isn't a green light though — you still need a catalyst (next question).","tags":["iv-hv","cheap-rich","edge-test"]},{"id":"opt-112","module":"vol-edge","level":3,"question":"Vol is CHEAP (IV/HV 0.72) but there's NO catalyst — no earnings, no Fed, no event — in the option's life. The engine says CHEAP·WAIT. Why not just buy the cheap vol?","options":["Cheap vol can't be traded","Without a driver, theta bleeds the position daily — cheap vol with no catalyst is a slow loss, not an edge","You always buy cheap vol","Because SPY never moves"],"correct_index":1,"why":"Cheapness tells you the move is underpriced; a CATALYST is what makes the move actually happen before theta eats you. Cheap vol + no catalyst = you're paying rent (theta) for a move that has no reason to come. The pros wait for cheap vol AND a driver (earnings 5–14d out, Fed/CPI 2–5d). That's the difference between the engine's CHEAP·WAIT and a real GO.","tags":["catalyst","theta","cheap-wait"],"debate":[{"author":"tastytrade","stance":"Wouldn't buy it at all — long premium has negative expectancy on average (VRP)."},{"author":"SteadyOptions","stance":"Agrees — buy only when a catalyst will lift IV while you hold; no catalyst, no trade."},{"author":"Option Alpha","stance":"Systematic trigger missing — no IV-expansion driver means no entry signal."}]},{"id":"opt-113","module":"vol-edge","level":3,"question":"It's the day before earnings. IV is jacked to the 90th percentile. You buy a straddle expecting a big move. The stock gaps 4% the right way — and you still LOSE. What happened?","options":["The broker stole it","IV CRUSH — post-earnings IV collapsed 30–60%, and the vega loss outran your directional gain","You bought the wrong strike","Theta over one night"],"correct_index":1,"why":"A long straddle is long vega. Buying it at 90th-percentile IV means you paid for a huge expected move; once the news is out, IV crushes 30–60% and the premium deflates even if direction was right — unless the move beats the (already enormous) implied move. This is THE classic earnings trap. SteadyOptions' answer: buy the IV RAMP days before and EXIT BEFORE the print — never hold a long single-leg through the crush.","tags":["iv-crush","earnings","vega"],"rh_note":"On RH, holding a long call/put through earnings is the fastest way to be 'right and still red.' Close before the print or use a calendar."},{"id":"opt-114","module":"vol-edge","level":3,"question":"projectfinance's mechanics: a 30-day ATM option's time value doesn't decay evenly. Roughly when has it lost about HALF its time value?","options":["By day 1","By about day 8 (the back half of the clock decays fastest)","Only in the last hour","Evenly — 1/30 per day"],"correct_index":1,"why":"Theta is non-linear and BACK-LOADED: a 30-day ATM loses ~50% of its time value by ~day 8, and the decay accelerates into expiry (OTM options bleed even faster late). This is why 'I'll give it time' is a trap — the rent goes UP the longer you hold. It's also why the engine sets a 21-DTE time-stop: past that, theta acceleration works hard against a long option.","tags":["theta","back-loaded","dte"]},{"id":"opt-115","module":"vol-edge","level":2,"question":"It's Friday. You're holding a long option over the weekend (market closed Sat/Sun). What happens to theta?","options":["Theta pauses — markets are closed","Theta keeps decaying — you pay ~3 calendar days of time value Friday→Monday for 0 trading days","You gain theta","Nothing changes"],"correct_index":1,"why":"Time value tracks CALENDAR time, not trading days. A long option over a weekend decays ~3 days while you get 0 trading sessions to be right — and a 3-day holiday weekend is even worse (2–3× a normal day's bleed). Market makers price weekend/holiday theta in on Friday. This is exactly why a long straddle over a closed Friday (e.g. Juneteenth) is a theta trap — buy further-dated or wait.","tags":["theta","weekend","holiday"]},{"id":"opt-116","module":"vol-edge","level":3,"question":"The 'edge ratio' the engine reports = realized move ÷ implied move. It reads 1.35. What does that mean for a straddle buyer?","options":["Bad — the move is overpriced","Good — the stock typically moves 1.35× what the straddle is pricing, so the move is CHEAP (buyer's edge)","It means sell premium","Nothing useful"],"correct_index":1,"why":"edge_ratio = realized/implied. >1 means the stock has historically moved MORE than the option is pricing → you're buying a move at a discount. <1 means the move is overpriced → you'd overpay (seller's edge). It's the same cheap/rich idea as IV/HV but expressed directly in move terms, which is easier to act on: 'they're charging me for a 1% move and this thing usually does 1.35%.'","tags":["edge-ratio","implied-vs-realized","core"]},{"id":"opt-117","module":"vol-edge","level":3,"question":"tastytrade's core claim: across thousands of trades, buying premium has roughly NEGATIVE expectancy. What structural fact makes that true?","options":["Brokers cheat buyers","The Variance Risk Premium — implied vol is systematically HIGHER than realized vol, so on average buyers overpay and sellers collect","Options always expire worthless","Stocks only go up"],"correct_index":1,"why":"The Variance Risk Premium (VRP): IV trades above subsequent realized vol most of the time because people pay up for insurance/leverage. So a naive 'always buy straddles' bleeds the premium. That's why tastytrade SELLS. The buyer's counter (SteadyOptions): don't fight the VRP by holding to expiry — exit before the crush and harvest the IV RAMP. Both are internally consistent; the VRP is why you can't buy blindly.","tags":["vrp","tastytrade","expectancy"]},{"id":"opt-118","module":"vol-edge","level":3,"question":"SMB Capital's earnings method: a stock has averaged an 8% move on its last several earnings, but the straddle is currently pricing only a 5% move. SMB's read?","options":["Sell an iron condor","BUY the straddle — the implied move (5%) is UNDER the stock's historical move (8%), so it's mispriced cheap","Do nothing","Buy stock instead"],"correct_index":1,"why":"SMB prices the straddle against the stock's OWN historical earnings moves. Implied 5% < historical 8% → the market is underpricing this name's tendency to move on earnings → buy. Flip it (implied 11% vs historical 8%) → sell premium / iron condor OUTSIDE the expected move. It's the cleanest 'is the move cheap or rich' test because the benchmark is the stock's actual track record, not a generic vol number.","tags":["smb","earnings","historical-move"]},{"id":"opt-119","module":"vol-edge","level":2,"question":"IV Rank (IVR) tells you where today's IV sits in its own 52-week range. You see IVR = 15. For a premium BUYER, is that good or bad?","options":["Bad — IV is high","Good — IV is near its 1-year LOW (cheap), the zone to BUY premium, not sell it","Irrelevant","It means earnings are coming"],"correct_index":1,"why":"IVR < ~20–30 = vol is cheap relative to its own history → buy premium / avoid selling. IVR > ~50–80 = vol is rich → sell premium / avoid buying single legs. The IV-regime gate: high IVR → be a seller (credit spreads, iron condors); low IVR → be a buyer (debit structures, straddles when a catalyst exists). Trading the wrong side of the IV regime is a top retail mistake.","tags":["iv-rank","regime","buy-sell"]},{"id":"opt-120","module":"vol-edge","level":3,"question":"Into the final day, your ATM option's GAMMA spikes hard. What's the practical danger of holding ATM into expiration?","options":["Nothing — gamma is good","Pin risk + violent P/L swings — tiny stock moves flip the option's delta wildly, and assignment/exercise gets messy","Theta disappears","IV goes to infinity"],"correct_index":1,"why":"ATM gamma explodes near expiry: delta swings from ~0 to ~1 on small moves, so P/L whipsaws and the option can pin near the strike (max uncertainty about ITM/OTM). For a buyer it means your edge is now a coin flip on noise; for anyone short it's assignment risk. Manage or close before the last day rather than gambling on the gamma knife-edge.","tags":["gamma","pin-risk","expiration"]},{"id":"opt-121","module":"management","level":2,"question":"You're long a straddle. The CALL leg is +80% and the PUT leg is nearly worthless after a clean move up. Best management?","options":["Hold both and hope the put recovers","Cut the dead leg — take the winning call (or trail it) and stop paying to hold a put that's lost its thesis","Buy more puts","Sell the call, hold the put"],"correct_index":1,"why":"Once direction resolves, the losing leg is dead weight with decaying theta and no thesis. 'Cut the dead leg': lock or trail the winner, close the loser. Holding the dead put hoping for a reversal is how a winning straddle round-trips back to red. This is the exact lesson from the post-FOMC trade — the put won, the call was worthless; the edge was in NOT giving the winner back.","tags":["cut-dead-leg","straddle","manage"],"rh_note":"Your real post-FOMC straddle: put won, call died. Cutting the dead call and riding/locking the put is what turns a +30% into a kept +30%."},{"id":"opt-122","module":"management","level":2,"question":"A long option position hits +50% on the debit you paid. The disciplined move that the profit-lock daemon now does in shadow mode?","options":["Hold for +500% or zero","Sell HALF (bank the win), then arm a breakeven stop on the runner so the rest can't go red","Double down","Sell everything and never re-enter"],"correct_index":1,"why":"Scale-out: at +T1 (≈+50%) sell half to bank a real gain, then move the stop to breakeven on the remaining half so the worst case on the runner is flat — you've made money and given yourself a free shot at the home run. 'Scale winners, never give it all back.' This is now mechanical in profit_lock_daemon (SCALE_OUT_MODE), not just a rule in your head.","tags":["scale-out","breakeven","t1"]},{"id":"opt-123","module":"management","level":2,"question":"Your long straddle is down 50% of the debit you paid and the catalyst already passed. The engine's rule?","options":["Average down","Cut it — the −50% stop. The thesis (a move) didn't show; the rest is theta bleed","Hold to expiration","Roll it out a year"],"correct_index":1,"why":"STOP_FRAC = 0.50: a long straddle down 50% with the catalyst gone has failed its thesis — the expected move didn't materialize and theta will finish the job. The stop IS the trade: you survive to take the next setup. Averaging down on a decaying long-vol position is throwing more rent at a move that isn't coming.","tags":["stop","risk","straddle"]},{"id":"opt-124","module":"management","level":3,"question":"Option Alpha's adjustment: you're long a straddle that's run your way and you want to LOCK gains while cutting theta. One classic move?","options":["Buy more of both legs","Convert toward a butterfly — sell OTM wings against your long straddle to take in credit, cap risk, and reduce theta","Close and walk away only","Add a third leg at random"],"correct_index":1,"why":"Selling OTM options against your long straddle (toward an iron butterfly/condor) collects premium that offsets theta and locks in some of the move, in exchange for capping further upside. It's a way to 'bank the move without fully exiting.' Option Alpha leans on systematic adjustments like this; the alternative is simply scaling out. Both beat passively holding a winner into decay.","tags":["butterfly","adjust","option-alpha"]},{"id":"opt-125","module":"management","level":3,"question":"After a sharp directional move, your straddle is now badly off-center (stock far from the strike). A way to keep the long-vol thesis alive?","options":["Nothing can be done","ROLL the losing leg toward the money (re-center) so the structure tracks the new price","Close the winning leg only","Buy stock to hedge"],"correct_index":1,"why":"When price runs, the straddle is no longer ATM — the far leg is dead and the near leg is doing all the work. Rolling the losing leg up/down re-centers the position so it can still profit from continued movement, at the cost of more debit. It's a judgment call vs. just cutting the dead leg; roll when you still believe in MORE movement, cut when the move is done.","tags":["roll","recenter","straddle"]},{"id":"opt-126","module":"management","level":2,"question":"T1 just filled (you sold half at +50%). What's the 'breakeven-after-T1' rule for the remaining half?","options":["Set a new target at +1000%","Move the stop to your ENTRY price — the runner can no longer turn the trade into a loss","Add to the position","Remove all stops"],"correct_index":1,"why":"Breakeven-after-T1: once you've banked half at the first target, slide the stop on the rest to your entry. Now the worst case is 'I made money on half and broke even on the rest' — you've removed the risk of a winner becoming a loser. It's the mechanical heart of 'never give it all back,' and it's what arms after the T1 partial in the profit-lock daemon.","tags":["breakeven","scale-out","stop"]},{"id":"opt-127","module":"management","level":3,"question":"You want to play an earnings move but refuse to eat the IV crush. Which structure is BUILT to harvest the crush instead of being killed by it?","options":["Long single-leg call","A CALENDAR (sell the front-month/expiry that crushes, buy a later one) — you're net short the crushing IV","Long straddle held through the print","Naked short put"],"correct_index":1,"why":"A calendar sells the near-dated option (whose IV crushes hardest right after the event) and buys a later-dated one (whose IV holds better), so the post-print IV collapse HELPS you. It's the preferred earnings structure when you expect a contained move: harvest the crush rather than fight it. Long single legs through earnings are the VETO case — right direction, still red.","tags":["calendar","iv-crush","earnings"]},{"id":"opt-128","module":"debate","level":3,"question":"Setup: IV Rank is 85 (vol near a 1-year high), no strong directional view, you want to trade the elevated vol. Whose playbook FITS this setup best?","options":["SteadyOptions — buy the IV ramp","tastytrade — SELL premium (defined-risk: iron condor/credit spread); rich IV favors the seller","Just buy a long straddle","projectfinance — buy an OTM strangle"],"correct_index":1,"why":"High IVR + no directional view = a SELLER's setup. tastytrade is right HERE: when IV is rich, sell premium and let the VRP work for you (prefer DEFINED-risk on a small account — an iron condor, not a naked strangle). SteadyOptions buys vol, but only when it's CHEAP and a catalyst will lift it — the opposite of IVR 85. Same market, different regime: the skill is matching the author to the vol regime.","tags":["debate","iv-regime","tastytrade"],"debate":[{"author":"tastytrade","stance":"FITS: IV rich → sell premium, manage at 50%. Their home turf."},{"author":"SteadyOptions","stance":"Would PASS: they buy cheap vol + catalyst; IVR 85 is the wrong side."},{"author":"SMB","stance":"Only if it's a pre-earnings name and implied > historical move → sell outside the move."},{"author":"Option Alpha","stance":"Mechanical seller here too — high IVR is a premium-selling trigger."},{"author":"projectfinance","stance":"Neutral mechanics — would note theta favors the seller at high IV."}]},{"id":"opt-129","module":"debate","level":3,"question":"Setup: IV Rank is 12 (vol near a 1-year LOW) and a Fed decision lands in 4 days. Whose approach fits?","options":["tastytrade — sell premium","SteadyOptions / Option Alpha — BUY premium: cheap vol + a catalyst that should EXPAND IV before the event","Do nothing — IV is too low to trade","SMB — sell an iron condor"],"correct_index":1,"why":"Low IVR + a known catalyst = a BUYER's setup. SteadyOptions buys the pre-event IV ramp; Option Alpha's trigger is 'need IV to expand.' Cheap vol means you're not overpaying, and the Fed event is the driver that lifts IV (and can move the underlying). tastytrade generally won't buy, but even they'd agree selling vol at IVR 12 is a poor risk/reward. The catalyst is what separates this GO from the earlier CHEAP·WAIT.","tags":["debate","catalyst","steadyoptions"],"debate":[{"author":"SteadyOptions","stance":"FITS: buy the ramp into the Fed, exit before/at the event as IV peaks."},{"author":"Option Alpha","stance":"FITS: low IV + catalyst = IV-expansion trigger met."},{"author":"tastytrade","stance":"Won't sell at IVR 12 (no premium to collect); generally stays out of long vol."},{"author":"SMB","stance":"Wants a historical-move benchmark; Fed isn't a single-stock earnings move."}]},{"id":"opt-130","module":"debate","level":3,"question":"tastytrade says long premium has NO edge. SteadyOptions makes money BUYING premium. They can't both be right — or can they? What reconciles it?","options":["One of them is lying","Different TRADES: tastytrade holds to expiry (pays the VRP); SteadyOptions EXITS before the IV crush, harvesting the ramp — so they're not doing the same thing","tastytrade is always right","SteadyOptions is always right"],"correct_index":1,"why":"This is the most important reconciliation in the whole playbook. 'Buying premium' isn't one strategy. tastytrade's data is about HOLDING long options to expiration — there the VRP makes it a loser. SteadyOptions never holds through the crush; they buy the pre-earnings IV RAMP and SELL before the print, capturing rising vega while avoiding the crush. Same instrument, opposite holding period = opposite expectancy. Understanding WHY both are right is mastery; memorizing one rule is the 'limiting' trap.","tags":["debate","vrp","reconcile","core"],"debate":[{"author":"tastytrade","stance":"Measures HOLD-to-expiry long premium → negative expectancy (VRP). True for that trade."},{"author":"SteadyOptions","stance":"Buys the IV ramp, EXITS before the crush → positive expectancy. True for THAT trade."},{"author":"Takeaway","stance":"'Buy or sell premium?' is the wrong question. 'What's my holding period vs the crush?' is the right one."}]},{"id":"opt-131","module":"debate","level":2,"question":"Same name, earnings in 2 days: the straddle prices an 11% move; the stock has historically moved ~8% on earnings. SMB Capital's call?","options":["Buy the straddle","SELL premium (e.g. an iron condor) OUTSIDE the expected move — implied (11%) is RICHER than the stock's historical (8%)","Buy a calendar","No trade possible"],"correct_index":1,"why":"SMB benchmarks implied vs the stock's OWN history. Implied 11% > historical 8% → the move is overpriced → be a seller, structuring an iron condor with short strikes outside the ~8% the stock actually tends to do. Flip the numbers (implied 5% < historical 8%) and SMB BUYS the straddle. The benchmark is the name's track record, which is why SMB's method travels across tickers.","tags":["debate","smb","historical-move"]},{"id":"opt-132","module":"debate","level":3,"question":"You're long a straddle; the up-move came, the call leg is +120%, the put is dead. 'Just hold both to expiry' vs Option Alpha's instinct — what's the disciplined play?","options":["Hold both to expiry and hope for more","MANAGE it — cut/trail the dead put, scale the call (take half, trail the rest); don't round-trip a +120% winner","Sell the call, buy more puts","Add another straddle on top"],"correct_index":1,"why":"Holding a resolved straddle to expiry surrenders the winner to theta and a possible reversal. The managed play: the put is dead (cut or let it expire worthless — its thesis is gone), and the call gets scaled — bank half at this huge gain, trail the rest with a breakeven-or-better stop. projectfinance's theta math says the back end of the clock punishes holders; Option Alpha says adjust/lock. Passive 'hold to expiry' is the trap.","tags":["debate","manage","cut-dead-leg"]},{"id":"opt-133","module":"debate","level":2,"question":"projectfinance stresses theta is BACK-LOADED. Given that, when is an OTM long straddle the MOST dangerous to keep holding?","options":["The first day","In the final third of its life — OTM time value decays fastest late, so a flat position bleeds out quickly near expiry","It's never dangerous","Only at the open"],"correct_index":1,"why":"projectfinance's mechanics: OTM options hold value early but decay viciously in the back third (an OTM can lose ~50% of value in roughly the last third of a 45-day life). So a straddle that hasn't worked and is drifting toward expiry is on a cliff. This is the math behind the engine's 21-DTE time-stop and the rule 'if it isn't working and the catalyst passed, don't let theta finish you.'","tags":["debate","theta","projectfinance","dte"]},{"id":"opt-134","module":"debate","level":3,"question":"On a small $3k account, you want long-vol exposure into a catalyst. tastytrade-style premium SELLING vs a defined-risk DEBIT structure — what's the account-survival call?","options":["Naked short strangle for max premium","Prefer a DEFINED-RISK debit structure (or defined-risk credit spread) — undefined-risk selling can take a multiple of a small account on one bad move","All-in on one long straddle","Sell naked puts on margin"],"correct_index":1,"why":"tastytrade's edge is real but they run big, diversified accounts that can absorb the tail of UNDEFINED-risk selling. On a $3k account, one naked short strangle gone wrong can blow a hole bigger than the account. The survival rule: keep risk DEFINED (debit spreads, iron condors, or sized long premium with a hard −50% stop) and size each trade ≤2–5% / ≤$250. Right strategy, wrong size = blown account.","tags":["debate","risk","account-size","defined-risk"],"rh_note":"On your $3k Boba book: defined-risk every time. The cap is ~$250/trade — one position should never be able to wreck the account."},{"id":"opt-135","module":"debate","level":3,"question":"Bottom line across all five educators — what's the ONE question every straddle/strangle decision actually reduces to?","options":["Is the chart bullish?","Is the IMPLIED move (what the straddle costs) CHEAP or RICH versus how this stock actually moves — and is there a catalyst to make the move happen?","What does the news say?","Is it a meme stock?"],"correct_index":1,"why":"Strip away the disagreements and all five agree on the frame: the ATM straddle price IS the expected move; you only buy when that move is underpriced (IV/HV < ~0.85, IVR low, implied < historical, edge_ratio > 1) AND a catalyst will deliver it before theta bites — otherwise you sell it or wait. tastytrade/SMB/Option Alpha lean seller when it's rich; SteadyOptions/Option Alpha lean buyer when it's cheap + catalyzed. The judgment is reading WHICH regime you're in.","tags":["debate","core","synthesis"]},{"id":"opt-136","module":"chart-read","level":2,"svg":"<svg viewBox=\"0 0 320 196\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"uptrend pullback to support\" style=\"max-width:340px;display:block;margin:2px auto 0;background:rgba(7,11,16,.55);border-radius:6px\"><line x1=\"36\" y1=\"14\" x2=\"36\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"168\" x2=\"308\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"130.8\" x2=\"308\" y2=\"130.8\" stroke=\"#36d6e7\" stroke-dasharray=\"4,3\" opacity=\".8\"/><text x=\"308\" y=\"128.8\" text-anchor=\"end\" font-family=\"monospace\" font-size=\"8\" fill=\"#36d6e7\">rising support</text><line x1=\"49.6\" y1=\"157.4\" x2=\"267.2\" y2=\"117.6\" stroke=\"#36d6e7\" stroke-width=\"1.3\" stroke-dasharray=\"5,3\" opacity=\".9\"/><line x1=\"49.6\" y1=\"117.6\" x2=\"49.6\" y2=\"157.4\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"41.7\" y=\"130.8\" width=\"15.8\" height=\"13.3\" fill=\"#3fb950\"/><line x1=\"76.8\" y1=\"91.0\" x2=\"76.8\" y2=\"144.1\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"68.9\" y=\"104.3\" width=\"15.8\" height=\"26.5\" fill=\"#3fb950\"/><line x1=\"104.0\" y1=\"64.4\" x2=\"104.0\" y2=\"117.6\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"96.1\" y=\"77.7\" width=\"15.8\" height=\"26.6\" fill=\"#3fb950\"/><line x1=\"131.2\" y1=\"37.9\" x2=\"131.2\" y2=\"91.0\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"123.3\" y=\"51.2\" width=\"15.8\" height=\"26.5\" fill=\"#3fb950\"/><line x1=\"158.4\" y1=\"24.6\" x2=\"158.4\" y2=\"64.4\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"150.5\" y=\"51.2\" width=\"15.8\" height=\"13.2\" fill=\"#f85149\"/><line x1=\"185.6\" y1=\"37.9\" x2=\"185.6\" y2=\"91.0\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"177.7\" y=\"64.4\" width=\"15.8\" height=\"13.3\" fill=\"#f85149\"/><line x1=\"212.8\" y1=\"64.4\" x2=\"212.8\" y2=\"104.3\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"204.9\" y=\"77.7\" width=\"15.8\" height=\"13.3\" fill=\"#f85149\"/><line x1=\"240.0\" y1=\"77.7\" x2=\"240.0\" y2=\"110.9\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"232.1\" y=\"91.0\" width=\"15.8\" height=\"13.3\" fill=\"#f85149\"/><line x1=\"267.2\" y1=\"91.0\" x2=\"267.2\" y2=\"117.6\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"259.3\" y=\"104.3\" width=\"15.8\" height=\"6.6\" fill=\"#f85149\"/><line x1=\"294.4\" y1=\"51.2\" x2=\"294.4\" y2=\"112.2\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"286.5\" y=\"64.4\" width=\"15.8\" height=\"46.5\" fill=\"#3fb950\"/><text x=\"294.4\" y=\"31.3\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#3fb950\">bounce ▲</text></svg>","question":"This name is in a clean uptrend and just pulled back to its RISING support line and printed a green bounce candle (your proven edge is CALLS, 8–14 DTE). What's the highest-quality play?","options":["Buy a 0DTE call right now to maximize leverage","Buy a slightly-ITM call (≈Δ0.45), 8–14 DTE, on the bounce confirmation off rising support","Buy a far-OTM Δ0.20 call because it's cheap","Short puts naked for premium into the bounce"],"correct_index":1,"why":"Buy-the-dip into rising support, WITH the trend, is the textbook long-call setup — and it matches your flow fingerprint (CALL · 8–14 DTE). A Δ0.45 slightly-ITM call gives balanced odds and leverage with survivable theta; 0DTE throws away the trend with no time; Δ0.20 is a lottery ticket; naked short puts are undefined risk on a small account.","tags":["chart-read","support","trend","contract-pick"]},{"id":"opt-137","module":"chart-read","level":2,"svg":"<svg viewBox=\"0 0 320 196\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"triple resistance rejection\" style=\"max-width:340px;display:block;margin:2px auto 0;background:rgba(7,11,16,.55);border-radius:6px\"><line x1=\"36\" y1=\"14\" x2=\"36\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"168\" x2=\"308\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"24.6\" x2=\"308\" y2=\"24.6\" stroke=\"#f85149\" stroke-dasharray=\"4,3\" opacity=\".8\"/><text x=\"308\" y=\"22.6\" text-anchor=\"end\" font-family=\"monospace\" font-size=\"8\" fill=\"#f85149\">resistance ✕3</text><line x1=\"49.6\" y1=\"109.1\" x2=\"49.6\" y2=\"157.4\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"41.7\" y=\"121.2\" width=\"15.8\" height=\"24.1\" fill=\"#3fb950\"/><line x1=\"76.8\" y1=\"36.7\" x2=\"76.8\" y2=\"133.2\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"68.9\" y=\"48.8\" width=\"15.8\" height=\"72.4\" fill=\"#3fb950\"/><line x1=\"104.0\" y1=\"24.6\" x2=\"104.0\" y2=\"60.8\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"96.1\" y=\"36.7\" width=\"15.8\" height=\"12.1\" fill=\"#3fb950\"/><line x1=\"131.2\" y1=\"24.6\" x2=\"131.2\" y2=\"48.8\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"123.3\" y=\"36.7\" width=\"15.8\" height=\"72.4\" fill=\"#f85149\"/><line x1=\"158.4\" y1=\"85.0\" x2=\"158.4\" y2=\"121.2\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"150.5\" y=\"97.0\" width=\"15.8\" height=\"12.1\" fill=\"#3fb950\"/><line x1=\"185.6\" y1=\"28.2\" x2=\"185.6\" y2=\"109.1\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"177.7\" y=\"48.8\" width=\"15.8\" height=\"48.2\" fill=\"#3fb950\"/><line x1=\"212.8\" y1=\"24.6\" x2=\"212.8\" y2=\"60.8\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"204.9\" y=\"48.8\" width=\"15.8\" height=\"60.3\" fill=\"#f85149\"/><line x1=\"240.0\" y1=\"72.9\" x2=\"240.0\" y2=\"121.2\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"232.1\" y=\"85.0\" width=\"15.8\" height=\"24.1\" fill=\"#3fb950\"/><line x1=\"267.2\" y1=\"24.6\" x2=\"267.2\" y2=\"97.0\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"259.3\" y=\"36.7\" width=\"15.8\" height=\"48.3\" fill=\"#3fb950\"/><line x1=\"294.4\" y1=\"24.6\" x2=\"294.4\" y2=\"48.8\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"286.5\" y=\"36.7\" width=\"15.8\" height=\"84.5\" fill=\"#f85149\"/><text x=\"131.2\" y=\"15.0\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#f85149\">✕</text><text x=\"212.8\" y=\"15.0\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#f85149\">✕</text><text x=\"294.4\" y=\"15.0\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#f85149\">✕</text></svg>","question":"Price has tapped this flat ceiling THREE times and been rejected each time (last candle red, back below). A bullish flow alert just pinged. What's disciplined?","options":["Buy calls now — the 4th touch always breaks","Don't buy calls INTO triple resistance; wait for a clean breakout-and-retest, or take a small defined-risk put on the rejection","Buy a straddle and hope it breaks either way","Average into calls on every rejection"],"correct_index":1,"why":"Three rejections at the same level = supply is stacked there; buying calls straight into it is paying full premium for the lowest-odds entry. Either wait for a breakout that holds on a retest (then the level becomes support), or fade the rejection with a DEFINED-RISK put. 'The 4th touch always breaks' is a gambler's tell, not an edge.","tags":["chart-read","resistance","patience"]},{"id":"opt-138","module":"chart-read","level":3,"svg":"<svg viewBox=\"0 0 320 196\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"pre-earnings coil, high IV\" style=\"max-width:340px;display:block;margin:2px auto 0;background:rgba(7,11,16,.55);border-radius:6px\"><line x1=\"36\" y1=\"14\" x2=\"36\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"168\" x2=\"308\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"24.6\" x2=\"308\" y2=\"24.6\" stroke=\"#8593a1\" stroke-dasharray=\"4,3\" opacity=\".8\"/><text x=\"308\" y=\"22.6\" text-anchor=\"end\" font-family=\"monospace\" font-size=\"8\" fill=\"#8593a1\">range top</text><line x1=\"36\" y1=\"157.4\" x2=\"308\" y2=\"157.4\" stroke=\"#8593a1\" stroke-dasharray=\"4,3\" opacity=\".8\"/><text x=\"308\" y=\"155.4\" text-anchor=\"end\" font-family=\"monospace\" font-size=\"8\" fill=\"#8593a1\">range floor</text><line x1=\"49.6\" y1=\"24.6\" x2=\"49.6\" y2=\"157.4\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"41.7\" y=\"57.8\" width=\"15.8\" height=\"33.2\" fill=\"#3fb950\"/><line x1=\"76.8\" y1=\"24.6\" x2=\"76.8\" y2=\"124.2\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"68.9\" y=\"57.8\" width=\"15.8\" height=\"33.2\" fill=\"#f85149\"/><line x1=\"104.0\" y1=\"37.9\" x2=\"104.0\" y2=\"144.1\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"96.1\" y=\"77.7\" width=\"15.8\" height=\"13.3\" fill=\"#3fb950\"/><line x1=\"131.2\" y1=\"24.6\" x2=\"131.2\" y2=\"130.8\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"123.3\" y=\"77.7\" width=\"15.8\" height=\"26.6\" fill=\"#f85149\"/><line x1=\"158.4\" y1=\"51.2\" x2=\"158.4\" y2=\"137.5\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"150.5\" y=\"84.4\" width=\"15.8\" height=\"19.9\" fill=\"#3fb950\"/><line x1=\"185.6\" y1=\"44.5\" x2=\"185.6\" y2=\"124.2\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"177.7\" y=\"84.4\" width=\"15.8\" height=\"13.2\" fill=\"#f85149\"/><line x1=\"212.8\" y1=\"31.3\" x2=\"212.8\" y2=\"130.8\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"204.9\" y=\"71.1\" width=\"15.8\" height=\"26.5\" fill=\"#3fb950\"/><line x1=\"240.0\" y1=\"37.9\" x2=\"240.0\" y2=\"117.6\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"232.1\" y=\"71.1\" width=\"15.8\" height=\"19.9\" fill=\"#f85149\"/><line x1=\"267.2\" y1=\"51.2\" x2=\"267.2\" y2=\"124.2\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"259.3\" y=\"91.0\" width=\"15.8\" height=\"6.6\" fill=\"#f85149\"/><line x1=\"294.4\" y1=\"44.5\" x2=\"294.4\" y2=\"130.8\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"286.5\" y=\"77.7\" width=\"15.8\" height=\"19.9\" fill=\"#3fb950\"/><text x=\"158.4\" y=\"197.2\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#ffb020\">earnings in 2d · IV rank 85</text></svg>","question":"The stock has coiled into a tight range. The label says earnings in 2 days and IV rank 85. You're bullish. What's the trap-aware move?","options":["Buy a naked long call and hold it through the print","Recognize IV is rich pre-earnings — a naked long single-leg gets IV-CRUSHED; wait for after the print, or use a defined-risk / calendar structure to harvest the crush","Buy a naked long straddle the morning of earnings","Sell a naked strangle for the fat premium"],"correct_index":1,"why":"IV rank 85 into earnings means the fear premium is inflated and will collapse 30–60% the moment the report drops — you can be right on direction and still lose on a long single-leg. Either trade it AFTER the crush, or use a calendar (sell the front/buy the back) to harvest the crush. Naked long = crushed; naked short strangle = undefined risk on a small book.","tags":["chart-read","earnings","iv-crush","vol-edge"]},{"id":"opt-139","module":"chart-read","level":2,"svg":"<svg viewBox=\"0 0 320 196\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"bull flag breakout\" style=\"max-width:340px;display:block;margin:2px auto 0;background:rgba(7,11,16,.55);border-radius:6px\"><line x1=\"36\" y1=\"14\" x2=\"36\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"168\" x2=\"308\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"50.3\" x2=\"308\" y2=\"50.3\" stroke=\"#3fb950\" stroke-dasharray=\"4,3\" opacity=\".8\"/><text x=\"308\" y=\"48.3\" text-anchor=\"end\" font-family=\"monospace\" font-size=\"8\" fill=\"#3fb950\">flag breakout</text><line x1=\"158.4\" y1=\"50.3\" x2=\"267.2\" y2=\"67.4\" stroke=\"#36d6e7\" stroke-width=\"1.3\" stroke-dasharray=\"5,3\" opacity=\".9\"/><line x1=\"49.6\" y1=\"127.4\" x2=\"49.6\" y2=\"157.4\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"41.7\" y=\"131.7\" width=\"15.8\" height=\"21.4\" fill=\"#3fb950\"/><line x1=\"76.8\" y1=\"101.7\" x2=\"76.8\" y2=\"136.0\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"68.9\" y=\"106.0\" width=\"15.8\" height=\"25.7\" fill=\"#3fb950\"/><line x1=\"104.0\" y1=\"76.0\" x2=\"104.0\" y2=\"110.3\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"96.1\" y=\"80.3\" width=\"15.8\" height=\"25.7\" fill=\"#3fb950\"/><line x1=\"131.2\" y1=\"50.3\" x2=\"131.2\" y2=\"84.6\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"123.3\" y=\"54.6\" width=\"15.8\" height=\"25.7\" fill=\"#3fb950\"/><line x1=\"158.4\" y1=\"50.3\" x2=\"158.4\" y2=\"67.4\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"150.5\" y=\"54.6\" width=\"15.8\" height=\"8.6\" fill=\"#f85149\"/><line x1=\"185.6\" y1=\"58.9\" x2=\"185.6\" y2=\"71.7\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"177.7\" y=\"63.2\" width=\"15.8\" height=\"4.2\" fill=\"#f85149\"/><line x1=\"212.8\" y1=\"63.2\" x2=\"212.8\" y2=\"76.0\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"204.9\" y=\"67.4\" width=\"15.8\" height=\"4.3\" fill=\"#f85149\"/><line x1=\"240.0\" y1=\"67.4\" x2=\"240.0\" y2=\"77.7\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"232.1\" y=\"71.7\" width=\"15.8\" height=\"2.6\" fill=\"#f85149\"/><line x1=\"267.2\" y1=\"67.4\" x2=\"267.2\" y2=\"78.6\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"259.3\" y=\"74.3\" width=\"15.8\" height=\"1.7\" fill=\"#f85149\"/><line x1=\"294.4\" y1=\"24.6\" x2=\"294.4\" y2=\"76.0\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"286.5\" y=\"33.2\" width=\"15.8\" height=\"42.8\" fill=\"#3fb950\"/><text x=\"104.0\" y=\"110.3\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#36d6e7\">pole</text><text x=\"294.4\" y=\"20.3\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#3fb950\">break ▲</text></svg>","question":"Strong pole up, then a tight downward-drifting flag, and now a breakout candle through the flag's top. This is your bread-and-butter continuation. Best contract?","options":["0DTE call — it's breaking now","A call with 8–14 DTE on the breakout — give the continuation room to run without paying the worst theta","A 60+ DTE deep-OTM call to be safe","Sell a call spread against the breakout"],"correct_index":1,"why":"A bull-flag breakout is a continuation pattern — your proven CALL · 8–14 DTE window fits perfectly: enough time for the next leg, not so little that theta eats you before the move plays out. 0DTE gives the move no room; 60-DTE deep-OTM over-pays for time and distance; selling a call spread fights the very breakout you identified.","tags":["chart-read","bull-flag","breakout","dte"]},{"id":"opt-140","module":"chart-read","level":3,"svg":"<svg viewBox=\"0 0 320 196\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"gap up then fade\" style=\"max-width:340px;display:block;margin:2px auto 0;background:rgba(7,11,16,.55);border-radius:6px\"><line x1=\"36\" y1=\"14\" x2=\"36\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"168\" x2=\"308\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"123.1\" x2=\"308\" y2=\"123.1\" stroke=\"#8593a1\" stroke-dasharray=\"4,3\" opacity=\".8\"/><text x=\"308\" y=\"121.1\" text-anchor=\"end\" font-family=\"monospace\" font-size=\"8\" fill=\"#8593a1\">pre-gap base</text><line x1=\"49.6\" y1=\"144.5\" x2=\"49.6\" y2=\"157.4\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"41.7\" y=\"148.8\" width=\"15.8\" height=\"4.3\" fill=\"#3fb950\"/><line x1=\"76.8\" y1=\"136.0\" x2=\"76.8\" y2=\"153.1\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"68.9\" y=\"140.2\" width=\"15.8\" height=\"8.6\" fill=\"#3fb950\"/><line x1=\"104.0\" y1=\"127.4\" x2=\"104.0\" y2=\"144.5\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"96.1\" y=\"131.7\" width=\"15.8\" height=\"8.5\" fill=\"#3fb950\"/><line x1=\"131.2\" y1=\"118.8\" x2=\"131.2\" y2=\"131.7\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"123.3\" y=\"123.1\" width=\"15.8\" height=\"4.3\" fill=\"#3fb950\"/><line x1=\"158.4\" y1=\"24.6\" x2=\"158.4\" y2=\"58.9\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"150.5\" y=\"41.8\" width=\"15.8\" height=\"8.5\" fill=\"#3fb950\"/><line x1=\"185.6\" y1=\"37.5\" x2=\"185.6\" y2=\"76.0\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"177.7\" y=\"41.8\" width=\"15.8\" height=\"25.6\" fill=\"#f85149\"/><line x1=\"212.8\" y1=\"58.9\" x2=\"212.8\" y2=\"93.1\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"204.9\" y=\"67.4\" width=\"15.8\" height=\"17.2\" fill=\"#f85149\"/><line x1=\"240.0\" y1=\"80.3\" x2=\"240.0\" y2=\"110.3\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"232.1\" y=\"84.6\" width=\"15.8\" height=\"17.1\" fill=\"#f85149\"/><line x1=\"267.2\" y1=\"93.1\" x2=\"267.2\" y2=\"123.1\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"259.3\" y=\"101.7\" width=\"15.8\" height=\"17.1\" fill=\"#f85149\"/><line x1=\"294.4\" y1=\"110.3\" x2=\"294.4\" y2=\"136.0\" stroke=\"#f85149\" stroke-width=\"1\"/><rect x=\"286.5\" y=\"118.8\" width=\"15.8\" height=\"8.6\" fill=\"#f85149\"/><text x=\"158.4\" y=\"16.1\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#3fb950\">+15% GAP</text><text x=\"185.6\" y=\"20.3\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#ffb020\">alert here ↓</text><text x=\"267.2\" y=\"80.3\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#f85149\">fading ▼</text></svg>","question":"The stock gapped +15% and is now FADING red candle after red candle. The bullish alert pinged AFTER the gap (see marker). What does the picture say?","options":["Chase the call — momentum names keep running","RAN_ALREADY / exhaustion — the move already happened and is reversing; chasing here means buying calls from the people taking profit. Skip it (or it's a short/​put context)","Buy calls because it's 'on sale' after the red candles","Add a long straddle to catch the next leg"],"correct_index":1,"why":"An alert that fires AFTER a big gap, with price already fading, is the classic RAN_ALREADY trap from the flow playbook — you'd be the late buyer the early money sells into. The disciplined read is no-trade (the edge is gone) or, with confirmation, a downside/defined-risk fade. 'On sale after a parabolic' ignores that the trend just flipped.","tags":["chart-read","exhaustion","chase","flow"]},{"id":"opt-141","module":"chart-read","level":2,"svg":"<svg viewBox=\"0 0 320 196\" xmlns=\"http://www.w3.org/2000/svg\" role=\"img\" aria-label=\"clean uptrend, pick the contract\" style=\"max-width:340px;display:block;margin:2px auto 0;background:rgba(7,11,16,.55);border-radius:6px\"><line x1=\"36\" y1=\"14\" x2=\"36\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"168\" x2=\"308\" y2=\"168\" stroke=\"#27323f\"/><line x1=\"36\" y1=\"153.2\" x2=\"308\" y2=\"153.2\" stroke=\"#36d6e7\" stroke-dasharray=\"4,3\" opacity=\".8\"/><text x=\"308\" y=\"151.2\" text-anchor=\"end\" font-family=\"monospace\" font-size=\"8\" fill=\"#36d6e7\">trend origin</text><line x1=\"49.6\" y1=\"157.4\" x2=\"294.4\" y2=\"45.4\" stroke=\"#36d6e7\" stroke-width=\"1.3\" stroke-dasharray=\"5,3\" opacity=\".9\"/><line x1=\"49.6\" y1=\"136.6\" x2=\"49.6\" y2=\"157.4\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"41.7\" y=\"140.8\" width=\"15.8\" height=\"12.4\" fill=\"#3fb950\"/><line x1=\"76.8\" y1=\"124.2\" x2=\"76.8\" y2=\"144.9\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"68.9\" y=\"128.3\" width=\"15.8\" height=\"12.5\" fill=\"#3fb950\"/><line x1=\"104.0\" y1=\"111.7\" x2=\"104.0\" y2=\"132.5\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"96.1\" y=\"115.9\" width=\"15.8\" height=\"12.4\" fill=\"#3fb950\"/><line x1=\"131.2\" y1=\"99.3\" x2=\"131.2\" y2=\"120.0\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"123.3\" y=\"103.4\" width=\"15.8\" height=\"12.5\" fill=\"#3fb950\"/><line x1=\"158.4\" y1=\"86.9\" x2=\"158.4\" y2=\"107.6\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"150.5\" y=\"91.0\" width=\"15.8\" height=\"12.4\" fill=\"#3fb950\"/><line x1=\"185.6\" y1=\"74.4\" x2=\"185.6\" y2=\"95.1\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"177.7\" y=\"78.6\" width=\"15.8\" height=\"12.4\" fill=\"#3fb950\"/><line x1=\"212.8\" y1=\"62.0\" x2=\"212.8\" y2=\"82.7\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"204.9\" y=\"66.1\" width=\"15.8\" height=\"12.5\" fill=\"#3fb950\"/><line x1=\"240.0\" y1=\"49.5\" x2=\"240.0\" y2=\"70.3\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"232.1\" y=\"53.7\" width=\"15.8\" height=\"12.4\" fill=\"#3fb950\"/><line x1=\"267.2\" y1=\"37.1\" x2=\"267.2\" y2=\"57.8\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"259.3\" y=\"41.2\" width=\"15.8\" height=\"12.5\" fill=\"#3fb950\"/><line x1=\"294.4\" y1=\"24.6\" x2=\"294.4\" y2=\"45.4\" stroke=\"#3fb950\" stroke-width=\"1\"/><rect x=\"286.5\" y=\"28.8\" width=\"15.8\" height=\"12.4\" fill=\"#3fb950\"/><text x=\"267.2\" y=\"20.5\" text-anchor=\"middle\" font-family=\"monospace\" font-size=\"8.5\" fill=\"#3fb950\">strong uptrend</text></svg>","question":"Clean, steady uptrend riding its trendline. You want directional call exposure. Four contracts at the same expiry — which fits the house doctrine?","options":["Δ0.20 far-OTM call — cheapest, most contracts","Δ0.45 slightly-ITM call — balanced odds and leverage, survivable theta (the doctrine sweet spot)","Δ0.65 deep-ITM call — basically owns the stock, minimal leverage","Δ0.95 call — no time value, why bother with an option"],"correct_index":1,"why":"House vehicle doctrine: target Δ0.35–0.55 — balanced probability of finishing ITM and leverage, with theta under ~7%/day. Δ0.20 is a lottery ticket (≈20% ITM odds); Δ0.65 is a stock substitute (you pay for delta you could get cheaper in shares); Δ0.95 is shares with extra steps. Same thesis, smarter ticket — the flow gives you direction, you pick the contract.","tags":["chart-read","delta","contract-pick","vehicle"]}]};</script>
<script>
(function(){
  "use strict";
  var QS = BANK.questions, META = BANK.meta;
  var MODS = META.modules, MODBY = {}; MODS.forEach(function(m){ MODBY[m.id]=m; });
  var LETTERS = ["A","B","C","D"];
  var KEY = "oac_v1";

  // ---- state (localStorage) ----
  function loadState(){
    try{ var s = JSON.parse(localStorage.getItem(KEY)||"{}"); s.boxes=s.boxes||{}; s.stats=s.stats||{right:0,wrong:0}; return s; }
    catch(e){ return {boxes:{},stats:{right:0,wrong:0}}; }
  }
  function saveState(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
  var ST = loadState();

  // box: 1..5 (higher = better known). unseen = undefined.
  function box(id){ return ST.boxes[id]; }
  function recordAnswer(id, correct){
    var prev = ST.boxes[id]==null ? 2 : ST.boxes[id];
    ST.boxes[id] = correct ? Math.min(prev+1,5) : 1;
    if(correct) ST.stats.right++; else ST.stats.wrong++;
    saveState(ST);
  }
  function masteryPct(modId){
    var inMod = QS.filter(function(q){return q.module===modId;});
    if(!inMod.length) return 0;
    var mastered = inMod.filter(function(q){ return (ST.boxes[q.id]||0)>=3; }).length;
    return Math.round(mastered/inMod.length*100);
  }
  function overallMastery(){
    var mastered = QS.filter(function(q){ return (ST.boxes[q.id]||0)>=3; }).length;
    return Math.round(mastered/QS.length*100);
  }
  function reviewQueue(){
    // questions you've gotten wrong / are shaky on (box 1-2), weakest first
    return QS.filter(function(q){ var b=ST.boxes[q.id]; return b!=null && b<=2; })
             .sort(function(a,b){ return (ST.boxes[a.id]) - (ST.boxes[b.id]); });
  }

  // ---- util ----
  function shuffle(a){ a=a.slice(); for(var i=a.length-1;i>0;i--){ var j=Math.floor(Math.random()*(i+1)); var t=a[i];a[i]=a[j];a[j]=t; } return a; }
  function esc(s){ return String(s).replace(/[&<>"]/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c];}); }
  function el(html){ var d=document.createElement('div'); d.innerHTML=html.trim(); return d.firstChild; }
  function setProgress(p){ document.getElementById('topbarfill').style.width = Math.max(0,Math.min(100,p))+"%"; }

  var app = document.getElementById('app');

  // ---- session ----
  var session = null; // {queue, idx, right, wrong, mode, modId, exam}

  function startSession(mode, modId){
    var queue;
    if(mode==='module') queue = QS.filter(function(q){return q.module===modId;});
    else if(mode==='mixed') queue = shuffle(QS);
    else if(mode==='review') queue = reviewQueue();
    else if(mode==='exam') queue = shuffle(QS).slice(0, Math.min(50, QS.length));
    if(!queue || !queue.length){ renderHome("noreview"); return; }
    session = {queue:queue, idx:0, right:0, wrong:0, answered:false, mode:mode, modId:modId, exam:(mode==='exam')};
    renderQuestion();
  }

  // ---- screens ----
  function renderHome(flag){
    session=null; setProgress(0);
    var chips =
      '<div class="readout">'+
        '<div class="stat"><div class="v">'+QS.length+'</div><div class="l">Questions</div></div>'+
        '<div class="stat grn"><div class="v">'+overallMastery()+'%</div><div class="l">Mastery</div></div>'+
        '<div class="stat amb"><div class="v">'+(ST.exam!=null?ST.exam+'%':'—')+'</div><div class="l">Exam Best</div></div>'+
        '<div class="stat"><div class="v">'+(ST.stats.right+ST.stats.wrong)+'</div><div class="l">Answered</div></div>'+
      '</div>';
    var modes =
      '<div class="lbl">Train</div>'+
      '<div class="modes">'+
        '<button class="mode" data-mode="mixed"><span class="t">Mixed Quiz</span><span class="d">Random questions across every module.</span></button>'+
        '<button class="mode" data-mode="review"><span class="t">Review Misses</span><span class="d">Resurfaces what you got wrong — spaced repetition.</span></button>'+
        '<button class="mode exam" data-mode="exam" style="grid-column:1/-1"><span class="t">Final Exam — 50 Q, graded</span><span class="d">Sit the test. Get a grade + where a pro scores.</span></button>'+
        '<button class="mode ref" data-mode="reference" style="grid-column:1/-1"><span class="t">&#x1F4D6; Reference — Vol, the Greeks &amp; how the pros disagree</span><span class="d">The textbook: expected move, IV crush, theta decay + a live straddle calculator.</span></button>'+
      '</div>';
    var reviewN = reviewQueue().length;
    var noteHtml = flag==='noreview'
      ? '<div class="empty">Nothing to review yet — answer some questions first, and the ones you miss will collect here.</div>' : '';
    var modCards = '<div class="lbl">Modules — learn in order</div><div class="mods">'+
      MODS.map(function(m,i){
        var pct = masteryPct(m.id);
        return '<button class="modcard" data-mod="'+m.id+'">'+
          '<div class="h"><span class="nm"><span style="color:var(--amber)">'+(i+1)+'.</span> '+esc(m.name)+'</span><span class="pct">'+pct+'%</span></div>'+
          '<div class="bl">'+esc(m.blurb)+'</div>'+
          '<div class="pbar"><i style="width:'+pct+'%"></i></div>'+
        '</button>';
      }).join('')+'</div>';
    app.innerHTML =
      '<div class="hero">'+
        '<p class="crumb">OPTIONS · ROBINHOOD · $6K → BEAT THE PRO</p>'+
        '<h1>Options<br>Academy</h1>'+
        '<p class="tagline">Learn options <b>correctly</b> — every answer explains the <b>why</b>. Risk-first, built for your real account. '+(reviewN?('<b>'+reviewN+'</b> to review.'):'')+'</p>'+
        chips+
      '</div>'+ noteHtml + modes + modCards +
      '<div class="foot">OPTIONS TRADING ACADEMY · self-contained · progress saved on this device<br>Educational only — not financial advice. Size every trade to a loss you can survive.</div>';
    [].forEach.call(app.querySelectorAll('.mode'), function(b){ b.onclick=function(){ var m=b.getAttribute('data-mode'); if(m==='reference'){renderReference();return;} startSession(m); }; });
    [].forEach.call(app.querySelectorAll('.modcard'), function(b){ b.onclick=function(){ startSession('module', b.getAttribute('data-mod')); }; });
  }

  function renderQuestion(){
    var s=session, q=s.queue[s.idx];
    s.answered=false;
    setProgress(s.idx / s.queue.length * 100);
    var m = MODBY[q.module]||{name:q.module};
    var lvName = {1:"Beginner",2:"Intermediate",3:"Advanced"}[q.level]||("L"+q.level);
    var head =
      '<div class="qmeta">'+
        '<span class="chip">'+esc(m.name)+'</span>'+
        '<span class="chip lv l'+q.level+'">'+lvName+'</span>'+
        '<span class="qcount">'+(s.exam?'EXAM ':'')+(s.idx+1)+' / '+s.queue.length+'</span>'+
      '</div>';
    // shuffle option ORDER per question (kills the "answer is always B" pattern tell);
    // data-i keeps the ORIGINAL index so grading/correctness logic is unchanged — only the
    // displayed letter is re-mapped to the visual slot. Order is stable within a session.
    s.order = s.order || {};
    if(!s.order[q.id]){ var _a=[]; for(var _k=0;_k<q.options.length;_k++)_a.push(_k); s.order[q.id]=shuffle(_a); }
    var order = s.order[q.id];
    var opts = '<div class="opts">'+ order.map(function(origIdx,slot){
      return '<button class="opt" data-i="'+origIdx+'"><span class="k">'+LETTERS[slot]+'</span><span class="tx">'+esc(q.options[origIdx])+'</span><span class="mk"></span></button>';

  function answer(i){
    var s=session; if(s.answered) return; s.answered=true;
    var q=s.queue[s.idx], correct=(i===q.correct_index);
    recordAnswer(q.id, correct);
    if(correct) s.right++; else s.wrong++;
    var btns = app.querySelectorAll('.opt');
    [].forEach.call(btns, function(b){
      var bi=parseInt(b.getAttribute('data-i'),10);
      b.classList.add('locked');
      if(bi===q.correct_index){ b.classList.add('correct'); b.querySelector('.mk').textContent='✓'; }
      else if(bi===i){ b.classList.add('wrong'); b.querySelector('.mk').textContent='✗'; }
      else b.classList.add('dim');
    });
    // in the exam we still teach (show why), but keep it tight
    var after = app.querySelector('.after');
    var corrSlot = (s.order && s.order[q.id]) ? s.order[q.id].indexOf(q.correct_index) : q.correct_index;
    var why = '<div class="why"><div class="ct">'+(correct?'✓ WHY YOU\'RE RIGHT':'✗ WHY THE ANSWER IS '+LETTERS[corrSlot])+'</div><p>'+esc(q.why)+'</p></div>';
    var debate = (q.debate && q.debate.length) ? '<div class="debate"><div class="ct">HOW THE PROS SEE IT</div>'+
      q.debate.map(function(d){ return '<div class="lens"><span class="who">'+esc(d.author)+'</span><span class="stance">'+esc(d.stance)+'</span></div>'; }).join('')+
      '</div>' : '';
    var rh = q.rh_note ? '<div class="rhnote"><div class="ct">YOUR $6K / ROBINHOOD</div><p>'+esc(q.rh_note)+'</p></div>' : '';
    var last = (s.idx>=s.queue.length-1);
    var controls = '<div class="controls">'+
      '<button class="btn ghost" id="quit">Home</button>'+
      '<button class="btn" id="next">'+(last?'See Results':'Next →')+'</button>'+
    '</div>';
    after.innerHTML = why + debate + rh + controls;
    document.getElementById('next').onclick = next;
    document.getElementById('quit').onclick = function(){ renderHome(); };
    after.scrollIntoView({behavior:'smooth', block:'nearest'});
  }

  function next(){
    var s=session;
    if(s.idx>=s.queue.length-1){ renderResults(); return; }
    s.idx++; renderQuestion();
  }

  function gradeLetter(pct){
    if(pct>=90) return ['A','a']; if(pct>=80) return ['B','b']; if(pct>=70) return ['C','c'];
    if(pct>=60) return ['D','d']; return ['F','f'];

  function renderResults(){
    var s=session; setProgress(100);
    var total=s.right+s.wrong, pct = total? Math.round(s.right/total*100):0;
    var g = gradeLetter(pct);

    var bench = s.exam
      ? '<div class="bench"><div class="ct">PRO BENCHMARK</div><p>'+esc(META.pro_benchmark)+'</p></div>' : '';

    var msg;
    if(pct>=90) msg='Pro-level. This is the money zone.';
    else if(pct>=75) msg='Strong. Drill the misses and you\'re dangerous.';
    else if(pct>=50) msg='Getting there — Review Misses will close the gap fast.';
    else msg='Early days. Run the modules in order; the why-notes do the teaching.';
    app.innerHTML =
      '<div class="results">'+
        '<p class="crumb mono" style="color:var(--cyan)">'+esc(title)+'</p>'+

    // calculator logic
    function calcUpdate(){
      var spot  = parseFloat(document.getElementById('ci-spot').value);
      var strad = parseFloat(document.getElementById('ci-strad').value);
      var iv    = parseFloat(document.getElementById('ci-iv').value);
      var hv    = parseFloat(document.getElementById('ci-hv').value);
      var debit = parseFloat(document.getElementById('ci-debit').value);
      var hist  = parseFloat(document.getElementById('ci-hist').value);
      var out   = document.getElementById('calc-out');
      if(!out) return;

      function fmt(n, dec){ return isNaN(n)||!isFinite(n) ? '&mdash;' : n.toFixed(dec!=null?dec:2); }
      function fmtPct(n){ return isNaN(n)||!isFinite(n) ? '&mdash;' : n.toFixed(1)+'%'; }
      function fmtD(n){ return isNaN(n)||!isFinite(n) ? '&mdash;' : '$'+n.toFixed(2); }

      var expMovePct = (spot>0 && strad>0) ? strad/spot*100 : NaN;
      var upBe = (spot>0 && strad>0) ? spot+strad : NaN;
      var dnBe = (spot>0 && strad>0) ? spot-strad : NaN;

      var ivhvRatio = (iv>0 && hv>0) ? iv/hv : NaN;
      var verdictHtml = '&mdash;';
      if(!isNaN(ivhvRatio)){
        if(ivhvRatio<=0.85) verdictHtml = fmt(ivhvRatio,2)+'<span class="verdict-chip cheap">CHEAP &mdash; buyer\'s edge</span>';
        else if(ivhvRatio>=1.20) verdictHtml = fmt(ivhvRatio,2)+'<span class="verdict-chip rich">RICH &mdash; seller\'s edge</span>';
        else verdictHtml = fmt(ivhvRatio,2)+'<span class="verdict-chip fair">FAIR</span>';
      }

      var edgeHtml = '&mdash;';
      if(!isNaN(hist) && hist>0 && !isNaN(expMovePct) && expMovePct>0){
        var edgeR = hist/expMovePct;
        if(edgeR>1) edgeHtml = fmt(edgeR,2)+'<span class="verdict-chip cheap">MOVE IS CHEAP</span>';
        else edgeHtml = fmt(edgeR,2)+'<span class="verdict-chip rich">OVERPRICED</span>';
      }

      var t1 = (debit>0) ? debit*1.5 : NaN;
      var stop = (debit>0) ? debit*0.5 : NaN;

      out.innerHTML =
        '<div class="calc-row"><span class="ck">Expected move</span><span class="cv">'+fmtD(strad)+' / '+fmtPct(expMovePct)+'</span></div>'+
        '<div class="calc-row"><span class="ck">UP breakeven</span><span class="cv">'+fmtD(upBe)+'</span></div>'+
        '<div class="calc-row"><span class="ck">DOWN breakeven</span><span class="cv">'+fmtD(dnBe)+'</span></div>'+
        '<div class="calc-row"><span class="ck">IV / HV ratio</span><span class="cv">'+verdictHtml+'</span></div>'+
        '<div class="calc-row"><span class="ck">Historical edge ratio</span><span class="cv">'+edgeHtml+'</span></div>'+
        '<div class="calc-row"><span class="ck">T1 exit (+50%) &mdash; sell half</span><span class="cv">'+fmtD(t1)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Stop (&minus;50%) &mdash; exit all</span><span class="cv">'+fmtD(stop)+'</span></div>';
    }

    [].forEach.call(app.querySelectorAll('input[id^="ci-"]'), function(inp){
      inp.oninput = calcUpdate;
    });
    calcUpdate();

    // ---- shared math: normal CDF (Abramowitz-Stegun) + Black-Scholes (r=0) ----
    function ncdf(x){
      var t=1/(1+0.2316419*Math.abs(x));
      var d=0.3989422804014327*Math.exp(-x*x/2);
      var p=d*t*(0.31938153+t*(-0.356563782+t*(1.781477937+t*(-1.821255978+t*1.330274429))));
      return x>=0 ? 1-p : p;
    }
    function bsVal(S,K,T,sig,type){
      var intr = Math.max(0, type==='call' ? S-K : K-S);
      if(T<=0 || sig<=0 || S<=0 || K<=0) return intr;
      var srt=sig*Math.sqrt(T);
      var d1=(Math.log(S/K)+0.5*sig*sig*T)/srt, d2=d1-srt;
      return type==='call' ? S*ncdf(d1)-K*ncdf(d2) : K*ncdf(-d2)-S*ncdf(-d1);
    }
    function plColor(plpc){ // plpc = P/L as fraction of premium
      var x=Math.max(-1,Math.min(2,plpc));
      if(x>=0){ var a=Math.min(1, x/1.5); return 'rgb('+Math.round(40-10*a)+','+Math.round(120+58*a)+','+Math.round(70+10*a)+')'; }
      var b=Math.min(1, -x); return 'rgb('+Math.round(120+72*b)+','+Math.round(70-25*b)+','+Math.round(55-15*b)+')';
    }

    // ---- F) CONTRACT P/L GRID ----
    var gType='call';
    function gridUpdate(){
      var spot=parseFloat(document.getElementById('gi-spot').value),
          K=parseFloat(document.getElementById('gi-strike').value),
          prem=parseFloat(document.getElementById('gi-prem').value),
          ivp=parseFloat(document.getElementById('gi-iv').value),
          dte=parseInt(document.getElementById('gi-dte').value,10);
      var tbl=document.getElementById('grid-table'), out=document.getElementById('grid-out');
      if(!tbl) return;
      if(!(spot>0&&K>0&&prem>0&&ivp>0&&dte>0)){ tbl.innerHTML='<p style="color:var(--mut);font-family:var(--mono);font-size:12px;padding:8px">Enter spot, strike, premium, IV, DTE…</p>'; out.innerHTML=''; return; }
      var sig=ivp/100, type=gType;
      var move=spot*sig*Math.sqrt(dte/365)*2; if(!(move>0)) move=spot*0.15;
      var rows=11, prices=[]; for(var r=0;r<rows;r++){ prices.push(spot+move*(1-2*r/(rows-1))); }
      var ncol=Math.min(8,dte+1), days=[]; for(var c=0;c<ncol;c++){ days.push(Math.round(dte-dte*c/(ncol-1))); }
      var be = type==='call' ? K+prem : K-prem;
      var h='<table class="plgrid"><thead><tr><th>price \\ DTE</th>';
      for(var c=0;c<ncol;c++){ var cliff=days[c]<=21&&days[c]>0; h+='<th class="'+(cliff?'colcliff':'')+'">'+days[c]+'d</th>'; }
      h+='</tr></thead><tbody>';
      var step=move/(rows-1);
      for(var r=0;r<rows;r++){
        var P=prices[r], nearSpot=Math.abs(P-spot)<step/2+1e-9;
        h+='<tr><td class="rowhdr'+(nearSpot?' spot':'')+'">$'+P.toFixed(2)+(nearSpot?' ◀':'')+'</td>';
        for(var c=0;c<ncol;c++){
          var T=days[c]/365, val=bsVal(P,K,T,sig,type), pl=val-prem, plpc=pl/prem;
          var beCell=(r<rows-1)&&((prices[r]-be)*(prices[r+1]-be)<=0);
          h+='<td class="cell'+(beCell?' be':'')+'" style="background:'+plColor(plpc)+'" title="$'+pl.toFixed(2)+'/sh value $'+val.toFixed(2)+'">'+(pl>=0?'+':'')+(plpc*100).toFixed(0)+'%</td>';
        }
        h+='</tr>';
      }
      tbl.innerHTML=h+'</tbody></table>';
      // POP + expected move + the 3 exit marks
      var T0=dte/365, srt=sig*Math.sqrt(T0);
      var pop = type==='call' ? ncdf((Math.log(spot/be)-0.5*sig*sig*T0)/srt)
                              : ncdf((Math.log(be/spot)+0.5*sig*sig*T0)/srt);
      var oneSig=spot*sig*Math.sqrt(T0);
      var needPct=Math.abs(be-spot)/spot*100, sigPct=oneSig/spot*100;
      var fav = needPct<=sigPct;
      var t1=prem*1.5, stop=prem*0.5, cliffD=Math.min(21,dte);
      out.innerHTML=
        '<div class="calc-row"><span class="ck">Breakeven price</span><span class="cv">$'+be.toFixed(2)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Need to BE</span><span class="cv">'+(be>=spot?'+':'')+ (((be-spot)/spot)*100).toFixed(1)+'%</span></div>'+
        '<div class="calc-row"><span class="ck">Expected 1σ move</span><span class="cv">±'+sigPct.toFixed(1)+'% (±$'+oneSig.toFixed(2)+')</span></div>'+
        '<div class="calc-row"><span class="ck">Move vs priced-in</span><span class="cv">'+(fav?'<span class="verdict-chip cheap">FAVORABLE</span>':'<span class="verdict-chip rich">STIFF</span>')+'</span></div>'+
        '<div class="calc-row"><span class="ck">POP (finish past BE)</span><span class="cv">'+(pop*100).toFixed(0)+'%</span></div>'+
        '<div class="calc-row"><span class="ck">T1 — sell half at +50%</span><span class="cv">$'+t1.toFixed(2)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Stop — out at −50%</span><span class="cv">$'+stop.toFixed(2)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Theta cliff — exit by</span><span class="cv">'+cliffD+' DTE</span></div>'+
        '<div style="font-size:11.5px;color:var(--mut);margin-top:8px;line-height:1.5">POP on a long option is usually under 50% — the edge is the <b style="color:var(--ink)">payoff</b> (winners run +50/+100%, losses capped at the stop), not the hit-rate. If POP is low AND the move is STIFF, the contract is a lottery ticket — move closer to the money or pass.</div>';
    }
    [].forEach.call(app.querySelectorAll('#g-type .subtab'), function(b){
      b.onclick=function(){ gType=b.getAttribute('data-t');
        [].forEach.call(app.querySelectorAll('#g-type .subtab'),function(x){x.classList.remove('on');});
        b.classList.add('on'); gridUpdate(); };
    });
    [].forEach.call(app.querySelectorAll('input[id^="gi-"]'), function(inp){ inp.oninput=gridUpdate; });
    gridUpdate();

    // ---- G) MULTI-LEG PAYOFF ----
    function mlLegs(kind,A,B,wing){
      switch(kind){
        case 'long-call': return [[1,'call',A]];
        case 'long-put': return [[1,'put',A]];
        case 'bull-call': return [[1,'call',A],[-1,'call',B]];
        case 'bear-put': return [[1,'put',B],[-1,'put',A]];
        case 'straddle': return [[1,'call',A],[1,'put',A]];
        case 'strangle': return [[1,'put',A],[1,'call',B]];
        case 'iron-condor': return [[-1,'put',A],[1,'put',A-wing],[-1,'call',B],[1,'call',B+wing]];
      }
      return [[1,'call',A]];
    }
    function mlPayoff(legs,net,P){
      var sv=0; for(var i=0;i<legs.length;i++){ var L=legs[i], intr=L[1]==='call'?Math.max(0,P-L[2]):Math.max(0,L[2]-P); sv+=L[0]*intr; }
      return sv-net; // net>0 = debit paid; net<0 = credit received
    }
    function mlSync(){
      var kind=document.getElementById('ml-kind').value;
      var showB = (kind==='bull-call'||kind==='bear-put'||kind==='strangle'||kind==='iron-condor');
      var showWing = (kind==='iron-condor');
      document.getElementById('mlf-b').style.display = showB?'':'none';
      document.getElementById('mlf-wing').style.display = showWing?'':'none';
      var lblA=document.querySelector('#mlf-a label'), lblNet=document.querySelector('#mlf-net label');
      lblA.innerHTML = (kind==='iron-condor')?'Short put strike':(showB?'Strike A (lower)':'Strike');
      lblNet.innerHTML = (kind==='iron-condor')?'Net credit (enter &minus;)':'Net debit(+)/credit(&minus;) $';
    }
    function mlUpdate(){
      var kind=document.getElementById('ml-kind').value,
          spot=parseFloat(document.getElementById('ml-spot').value),
          A=parseFloat(document.getElementById('ml-a').value),
          B=parseFloat(document.getElementById('ml-b').value),
          net=parseFloat(document.getElementById('ml-net').value),
          wing=parseFloat(document.getElementById('ml-wing').value);
      var box=document.getElementById('payoff-svg'), out=document.getElementById('ml-out');
      if(!box) return;
      if(isNaN(A)||isNaN(net)||isNaN(spot)){ box.innerHTML=''; out.innerHTML='<p style="color:var(--mut);font-family:var(--mono);font-size:12px">Fill the inputs…</p>'; return; }
      if(isNaN(B)) B=A; if(isNaN(wing)) wing=5;
      var legs=mlLegs(kind,A,B,wing);
      var strikes=legs.map(function(L){return L[2];});
      var lo=Math.min.apply(null,strikes.concat([spot]))*0.78, hi=Math.max.apply(null,strikes.concat([spot]))*1.22;
      if(!(hi>lo)){ lo=spot*0.8; hi=spot*1.2; }
      var N=140, xs=[], ys=[], maxP=-1e9, minP=1e9;
      for(var i=0;i<=N;i++){ var P=lo+(hi-lo)*i/N, y=mlPayoff(legs,net,P); xs.push(P); ys.push(y); if(y>maxP)maxP=y; if(y<minP)minP=y; }
      // breakevens = zero crossings
      var bes=[]; for(var i=0;i<N;i++){ if(ys[i]===0) bes.push(xs[i]); else if(ys[i]*ys[i+1]<0){ var t=ys[i]/(ys[i]-ys[i+1]); bes.push(xs[i]+(xs[i+1]-xs[i])*t); } }
      // SVG geometry
      var X0=44,X1=312,Y0=18,Y1=168;
      var pad=(maxP-minP)*0.12||1; var yhi=maxP+pad, ylo=minP-pad;
      function sx(P){ return X0+(P-lo)/(hi-lo)*(X1-X0); }
      function sy(y){ return Y1-(y-ylo)/(yhi-ylo)*(Y1-Y0); }
      var zeroY=sy(0);
      var s='<svg viewBox="0 0 320 188" xmlns="http://www.w3.org/2000/svg" aria-label="payoff at expiration">';
      s+='<line x1="'+X0+'" y1="'+Y0+'" x2="'+X0+'" y2="'+Y1+'" stroke="rgba(39,50,63,.9)"/>';
      s+='<line x1="'+X0+'" y1="'+zeroY.toFixed(1)+'" x2="'+X1+'" y2="'+zeroY.toFixed(1)+'" stroke="#6b7785" stroke-dasharray="3,3"/>';
      s+='<text x="2" y="'+(Y0+8)+'" font-family="monospace" font-size="8" fill="#3fb950">+$'+maxP.toFixed(2)+'</text>';
      s+='<text x="2" y="'+(Y1)+'" font-family="monospace" font-size="8" fill="#f85149">'+ (minP<0?'-$'+Math.abs(minP).toFixed(2):'+$'+minP.toFixed(2))+'</text>';
      s+='<text x="'+(X1-2)+'" y="'+(zeroY-3).toFixed(1)+'" text-anchor="end" font-family="monospace" font-size="8" fill="#6b7785">$0 P/L</text>';
      // sign-split payoff line
      for(var i=0;i<N;i++){
        var ya=ys[i], yb=ys[i+1], xa=xs[i], xb=xs[i+1];
        if(ya*yb<0){ var t=ya/(ya-yb), xc=xa+(xb-xa)*t;
          s+='<line x1="'+sx(xa).toFixed(1)+'" y1="'+sy(ya).toFixed(1)+'" x2="'+sx(xc).toFixed(1)+'" y2="'+sy(0).toFixed(1)+'" stroke="'+(ya>=0?'#3fb950':'#f85149')+'" stroke-width="2"/>';
          s+='<line x1="'+sx(xc).toFixed(1)+'" y1="'+sy(0).toFixed(1)+'" x2="'+sx(xb).toFixed(1)+'" y2="'+sy(yb).toFixed(1)+'" stroke="'+(yb>=0?'#3fb950':'#f85149')+'" stroke-width="2"/>';
        } else {
          s+='<line x1="'+sx(xa).toFixed(1)+'" y1="'+sy(ya).toFixed(1)+'" x2="'+sx(xb).toFixed(1)+'" y2="'+sy(yb).toFixed(1)+'" stroke="'+(ya>=0?'#3fb950':'#f85149')+'" stroke-width="2"/>';
        }
      }
      // breakevens + spot
      bes.forEach(function(be){ var x=sx(be); s+='<line x1="'+x.toFixed(1)+'" y1="'+Y0+'" x2="'+x.toFixed(1)+'" y2="'+Y1+'" stroke="var(--amber)" stroke-dasharray="2,3" opacity=".8"/>'+
        '<text x="'+x.toFixed(1)+'" y="'+(Y1+9)+'" text-anchor="middle" font-family="monospace" font-size="7.5" fill="#ffb020">$'+be.toFixed(0)+'</text>'; });
      var xspot=sx(spot); s+='<line x1="'+xspot.toFixed(1)+'" y1="'+Y0+'" x2="'+xspot.toFixed(1)+'" y2="'+Y1+'" stroke="var(--cyan)" stroke-width="1.2"/>'+
        '<text x="'+xspot.toFixed(1)+'" y="'+(Y0-3>10?Y0+0:Y0)+'" font-family="monospace" font-size="0" fill="none"></text>'+
        '<text x="'+Math.min(X1-20,xspot+2).toFixed(1)+'" y="'+(Y0+8)+'" font-family="monospace" font-size="8" fill="#36d6e7">spot $'+spot.toFixed(0)+'</text>';
      s+='</svg>';
      box.innerHTML=s;
      var beTxt = bes.length? bes.map(function(b){return '$'+b.toFixed(2);}).join(' / ') : 'none in range';
      var risk = net>0 ? '$'+(net*100).toFixed(0)+' debit' : '$'+(Math.abs(net)*100).toFixed(0)+' credit';
      out.innerHTML=
        '<div class="calc-row"><span class="ck">Cost basis</span><span class="cv">'+risk+'/contract</span></div>'+
        '<div class="calc-row"><span class="ck">Max profit</span><span class="cv pnl-pos">+$'+(maxP*100).toFixed(0)+'</span></div>'+
        '<div class="calc-row"><span class="ck">Max loss</span><span class="cv pnl-neg">'+(minP<0?'-$'+Math.abs(minP*100).toFixed(0):'+$'+(minP*100).toFixed(0))+'</span></div>'+
        '<div class="calc-row"><span class="ck">Breakeven(s)</span><span class="cv">'+beTxt+'</span></div>'+
        '<div class="calc-row"><span class="ck">Risk : reward</span><span class="cv">'+((maxP>0&&minP<0)?'1 : '+(maxP/Math.abs(minP)).toFixed(2):'—')+'</span></div>';
    }
    document.getElementById('ml-kind').onchange=function(){ mlSync(); mlUpdate(); };
    [].forEach.call(app.querySelectorAll('input[id^="ml-"]'), function(inp){ inp.oninput=mlUpdate; });
    mlSync(); mlUpdate();
  }

  // keyboard: 1-4 answer, Enter/Space = next
  document.addEventListener('keydown', function(e){
    if(!session) return;
    if(!session.answered && /^[1-4]$/.test(e.key)){
      var i=parseInt(e.key,10)-1; var b=app.querySelectorAll('.opt')[i]; if(b){ e.preventDefault(); b.click(); }
    } else if(session.answered && (e.key==='Enter'||e.key===' ')){
      var nx=document.getElementById('next'); if(nx){ e.preventDefault(); nx.click(); }
    }
  });

  renderHome();
})();
</script>
</body>
</html>
