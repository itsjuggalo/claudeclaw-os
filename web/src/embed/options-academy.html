<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#070b10">
<title>Options Trading Academy</title>
<style>
:root{
  --bg:#070b10; --panel:#0e141c; --panel2:#131b25; --steel:#1a2530; --ink:#e9eef4; --mut:#8593a1;
  --line:#27323f; --line2:#324252;
  --amber:#ffb020; --amber2:#ffd479; --green:#3fb950; --red:#f85149; --blue:#58a6ff; --cyan:#36d6e7;
  --mono:"Cascadia Code","Cascadia Mono",Consolas,"Courier New",monospace;
  --disp:Bahnschrift,"Segoe UI Semibold","Arial Narrow",Arial,sans-serif;
  --body:"Segoe UI",Tahoma,Geneva,Verdana,sans-serif;
}
*{box-sizing:border-box}
html{scroll-behavior:smooth}
body{
  margin:0; background:var(--bg); color:var(--ink); font-family:var(--body);
  font-size:17px; line-height:1.55; -webkit-text-size-adjust:100%;
  background-image:
    radial-gradient(ellipse 90% 45% at 50% -8%, rgba(54,214,231,.07), transparent 70%),
    radial-gradient(ellipse 70% 40% at 50% 105%, rgba(255,176,32,.05), transparent 70%),
    repeating-linear-gradient(0deg, transparent 0 3px, rgba(54,214,231,.018) 3px 4px);
  background-attachment:fixed;
}
.wrap{max-width:760px; margin:0 auto; padding:18px 14px 90px; position:relative; z-index:1}
button{font-family:inherit}
.mono{font-family:var(--mono)}

/* top progress bar */
#topbar{position:sticky; top:0; z-index:50; height:5px; background:rgba(7,11,16,.9);
  border-bottom:1px solid var(--line2)}
#topbar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--cyan),var(--blue));
  box-shadow:0 0 10px rgba(54,214,231,.5); transition:width .25s}

/* HERO */
.hero{position:relative; border:1px solid var(--line2); border-radius:10px; overflow:hidden;
  background:linear-gradient(160deg,#0c1622,#0a121b 60%,#0b0f15); padding:16px 16px 18px; margin-top:10px;
  box-shadow:inset 0 0 40px rgba(54,214,231,.06)}
.hero::after{content:""; position:absolute; top:0; left:0; right:0; height:3px;
  background:linear-gradient(90deg,var(--cyan),transparent 60%)}
.crumb{font-family:var(--mono); font-size:11px; letter-spacing:.18em; color:var(--cyan); margin:0 0 4px}
h1{font-family:var(--disp); font-size:clamp(28px,8vw,46px); line-height:.98; text-transform:uppercase;
  letter-spacing:.01em; margin:0}
h1 .n{color:var(--amber)}
.tagline{color:var(--mut); font-size:14px; margin:8px 0 0}
.tagline b{color:var(--amber2)}

/* readout chips */
.readout{display:flex; flex-wrap:wrap; gap:8px; margin-top:14px}
.stat{flex:1 1 90px; min-width:84px; border:1px solid var(--line); border-left:3px solid var(--cyan);
  background:rgba(54,214,231,.04); border-radius:0 5px 5px 0; padding:7px 10px}
.stat .v{font-family:var(--disp); font-size:22px; line-height:1; color:var(--ink)}
.stat .l{font-family:var(--mono); font-size:10px; letter-spacing:.1em; color:var(--mut); margin-top:3px; text-transform:uppercase}
.stat.amb{border-left-color:var(--amber); background:rgba(255,176,32,.05)} .stat.amb .v{color:var(--amber2)}
.stat.grn{border-left-color:var(--green); background:rgba(63,185,80,.05)} .stat.grn .v{color:var(--green)}

/* section label */
.lbl{font-family:var(--mono); font-size:11px; letter-spacing:.14em; color:var(--mut); text-transform:uppercase;
  margin:26px 0 10px; display:flex; align-items:center; gap:8px}
.lbl::after{content:""; flex:1; height:1px; background:linear-gradient(90deg,var(--line2),transparent)}

/* mode buttons */
.modes{display:grid; grid-template-columns:1fr 1fr; gap:9px}
.mode{display:flex; flex-direction:column; gap:3px; text-align:left; cursor:pointer; color:var(--ink);
  border:1px solid var(--line2); border-left:3px solid var(--blue); border-radius:7px; padding:11px 12px;
  background:linear-gradient(110deg,var(--panel2),var(--panel) 75%); transition:border-color .12s, box-shadow .12s}
.mode:hover,.mode:focus{border-left-color:var(--cyan); box-shadow:0 0 14px rgba(54,214,231,.12); outline:none}
.mode .t{font-family:var(--disp); font-size:16px; letter-spacing:.02em}
.mode .d{font-size:12px; color:var(--mut); line-height:1.35}
.mode.exam{border-left-color:var(--amber)} .mode.exam .t{color:var(--amber2)}

/* module cards */
.mods{display:grid; grid-template-columns:1fr; gap:9px; margin-top:4px}
@media(min-width:560px){ .mods{grid-template-columns:1fr 1fr} }
.modcard{display:block; text-align:left; cursor:pointer; color:var(--ink); width:100%;
  border:1px solid var(--line2); border-left:3px solid var(--cyan); border-radius:7px; padding:11px 12px;
  background:linear-gradient(110deg,var(--panel2),var(--panel) 70%); transition:border-color .12s, box-shadow .12s}
.modcard:hover,.modcard:focus{border-left-color:var(--amber); box-shadow:0 0 14px rgba(54,214,231,.1); outline:none}
.modcard .h{display:flex; align-items:baseline; justify-content:space-between; gap:8px}
.modcard .nm{font-family:var(--disp); font-size:16px; letter-spacing:.02em}
.modcard .pct{font-family:var(--mono); font-size:12px; color:var(--cyan)}
.modcard .bl{font-size:12px; color:var(--mut); line-height:1.35; margin:4px 0 8px}
.pbar{height:6px; border-radius:3px; background:var(--steel); overflow:hidden; border:1px solid var(--line)}
.pbar > i{display:block; height:100%; width:0; background:linear-gradient(90deg,var(--green),var(--cyan))}

/* QUESTION card */
.qcard{border:1px solid var(--line2); border-radius:10px; background:var(--panel); padding:15px 15px 16px; margin-top:12px}
.qmeta{display:flex; flex-wrap:wrap; align-items:center; gap:7px; margin-bottom:11px}
.chip{font-family:var(--mono); font-size:10px; letter-spacing:.08em; text-transform:uppercase; color:var(--bg);
  background:var(--cyan); padding:2px 8px; border-radius:3px}
.chip.lv{background:var(--blue)} .chip.lv.l2{background:var(--amber)} .chip.lv.l3{background:var(--red)}
.qcount{margin-left:auto; font-family:var(--mono); font-size:11px; color:var(--mut)}
.qtext{font-family:var(--disp); font-size:20px; line-height:1.3; margin:0 0 14px}
.svgwrap{margin:0 0 14px}
.opts{display:flex; flex-direction:column; gap:8px}
.opt{display:flex; gap:10px; align-items:flex-start; text-align:left; width:100%; cursor:pointer; color:var(--ink);
  border:1px solid var(--line2); border-radius:7px; padding:11px 12px; min-height:48px;
  background:var(--panel2); transition:border-color .12s, background .12s; font-size:15px; line-height:1.4}
.opt:hover:not(.locked){border-color:var(--cyan)}
.opt .k{font-family:var(--mono); font-size:13px; color:var(--mut); flex-shrink:0; width:16px}
.opt.locked{cursor:default}
.opt.correct{border-color:var(--green); background:rgba(63,185,80,.12)} .opt.correct .k{color:var(--green)}
.opt.wrong{border-color:var(--red); background:rgba(248,81,73,.12)} .opt.wrong .k{color:var(--red)}
.opt.dim{opacity:.5}
.opt .mk{margin-left:auto; font-weight:bold; flex-shrink:0}
.opt.correct .mk{color:var(--green)} .opt.wrong .mk{color:var(--red)}

/* why + rh note */
.why{border:1px solid var(--blue); border-left:3px solid var(--blue); border-radius:8px; padding:11px 13px; margin-top:13px;
  background:linear-gradient(180deg,rgba(88,166,255,.08),rgba(88,166,255,.02))}
.why .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--blue); margin-bottom:5px}
.why p{margin:0; font-size:14px; line-height:1.5; color:var(--ink)}
.rhnote{border:1px solid var(--amber); border-left:3px solid var(--amber); border-radius:8px; padding:10px 13px; margin-top:9px;
  background:linear-gradient(180deg,rgba(255,176,32,.09),rgba(255,176,32,.02))}
.rhnote .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--amber); margin-bottom:4px}
.rhnote p{margin:0; font-size:13.5px; line-height:1.45; color:var(--amber2)}
.debate{border:1px solid var(--purple,#a371f7); border-left:3px solid var(--purple,#a371f7); border-radius:8px; padding:10px 13px; margin-top:9px;
  background:linear-gradient(180deg,rgba(163,113,247,.10),rgba(163,113,247,.02))}
.debate .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--purple,#a371f7); margin-bottom:6px}
.debate .lens{display:flex; gap:9px; padding:5px 0; border-top:1px solid rgba(163,113,247,.16); font-size:13px; line-height:1.4}
.debate .lens:first-of-type{border-top:none}
.debate .who{flex:0 0 92px; font-weight:700; color:var(--purple,#a371f7)}
.debate .stance{flex:1; color:var(--ink)}
@media(max-width:480px){ .debate .lens{flex-direction:column; gap:1px} .debate .who{flex:none} }

/* controls */
.controls{display:flex; gap:9px; margin-top:15px; flex-wrap:wrap}
.btn{flex:1 1 auto; min-height:48px; cursor:pointer; font-family:var(--disp); font-size:16px; letter-spacing:.03em;
  color:var(--bg); background:var(--cyan); border:none; border-radius:7px; padding:11px 16px;
  box-shadow:0 0 14px rgba(54,214,231,.25)}
.btn:hover{filter:brightness(1.08)} .btn:active{transform:translateY(1px)}
.btn.ghost{color:var(--ink); background:transparent; border:1px solid var(--line2); box-shadow:none; flex:0 0 auto}
.btn.ghost:hover{border-color:var(--cyan)}
.btn.amb{background:var(--amber); color:#1a1206}

/* results */
.results{border:1px solid var(--line2); border-radius:10px; background:var(--panel); padding:20px 16px; margin-top:14px; text-align:center}
.grade{font-family:var(--disp); font-size:clamp(54px,18vw,90px); line-height:1; margin:6px 0}
.grade.a{color:var(--green)} .grade.b{color:var(--cyan)} .grade.c{color:var(--amber2)} .grade.d{color:var(--amber)} .grade.f{color:var(--red)}
.results .sc{font-family:var(--mono); font-size:15px; color:var(--mut)}
.results .sc b{color:var(--ink)}
.bench{border:1px solid var(--amber); border-radius:8px; padding:11px 13px; margin:15px 0 4px; text-align:left;
  background:linear-gradient(180deg,rgba(255,176,32,.08),rgba(255,176,32,.02))}
.bench .ct{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--amber); margin-bottom:5px}
.bench p{margin:0; font-size:13.5px; line-height:1.5; color:var(--ink)}
.empty{border:1px dashed var(--line2); border-radius:8px; padding:18px; text-align:center; color:var(--mut); margin-top:14px; font-size:14px}
.foot{margin-top:30px; font-family:var(--mono); font-size:10.5px; color:var(--mut); text-align:center; letter-spacing:.06em; line-height:1.6}

/* ---- REFERENCE / TEXTBOOK ---- */
.ref-section{margin:28px 0 0}
.ref-h{font-family:var(--disp); font-size:clamp(18px,5vw,26px); letter-spacing:.03em; text-transform:uppercase; color:var(--cyan); margin:0 0 10px}
.ref-sub{font-family:var(--mono); font-size:10.5px; letter-spacing:.14em; color:var(--mut); text-transform:uppercase; margin:0 0 6px}
.ref-card{border:1px solid var(--line2); border-left:3px solid var(--blue); border-radius:8px;
  background:linear-gradient(160deg,var(--panel2),var(--panel) 70%); padding:13px 14px; margin-bottom:10px}
.ref-card p{margin:0 0 8px; font-size:14px; line-height:1.55; color:var(--ink)}
.ref-card p:last-child{margin-bottom:0}
.ref-card .rt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--blue); margin-bottom:6px}
.ref-rule{border:1px solid var(--amber); border-left:3px solid var(--amber); border-radius:8px;
  background:linear-gradient(180deg,rgba(255,176,32,.08),rgba(255,176,32,.02)); padding:10px 13px; margin:10px 0}
.ref-rule .rt{font-family:var(--mono); font-size:10.5px; letter-spacing:.12em; color:var(--amber); margin-bottom:5px}
.ref-rule p{margin:0; font-size:13.5px; line-height:1.45; color:var(--amber2)}
/* theta decay SVG card */
.ref-svg-wrap{border:1px solid var(--line2); border-radius:8px; background:var(--panel2);
  padding:12px 10px 8px; margin:10px 0; overflow:hidden}
.ref-svg-wrap svg{display:block; width:100%; height:auto}
/* IV/HV bar */
.ivhv-wrap{border:1px solid var(--line2); border-radius:8px; background:var(--panel2); padding:14px; margin:10px 0}
.ivhv-row{display:flex; align-items:center; gap:10px; margin-bottom:8px; font-size:13px}
.ivhv-row:last-child{margin-bottom:0}
.ivhv-label{flex:0 0 80px; font-family:var(--mono); font-size:11px; color:var(--mut); text-align:right}
.ivhv-bar{flex:1; height:22px; border-radius:4px; position:relative; background:var(--steel); overflow:visible}
.ivhv-fill{height:100%; border-radius:4px; display:flex; align-items:center; padding-left:6px;
  font-family:var(--mono); font-size:11px; font-weight:700}
.ivhv-tick{position:absolute; top:-4px; bottom:-4px; width:2px; background:var(--amber); border-radius:1px}
.ivhv-tick-label{position:absolute; top:-18px; font-family:var(--mono); font-size:10px; color:var(--amber); white-space:nowrap; transform:translateX(-50%)}
/* debate table (reference variant) */
.ref-debate{width:100%; border-collapse:collapse; font-size:13px; margin:8px 0}
.ref-debate th{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--mut);
  border-bottom:1px solid var(--line2); padding:5px 8px; text-align:left; white-space:nowrap}
.ref-debate td{padding:7px 8px; border-bottom:1px solid rgba(39,50,63,.6); vertical-align:top; line-height:1.4}
.ref-debate td:first-child{font-weight:700; color:var(--purple,#a371f7); white-space:nowrap}
.ref-debate td:nth-child(3){font-family:var(--mono); font-size:11px; color:var(--cyan)}
.ref-debate tr:last-child td{border-bottom:none}
@media(max-width:520px){
  .ref-debate thead{display:none}
  .ref-debate td{display:block; padding:3px 8px}
  .ref-debate td:first-child{padding-top:9px; font-size:14px}
  .ref-debate tr{display:block; border-bottom:1px solid var(--line2); margin-bottom:4px; padding-bottom:4px}
}
/* straddle calculator */
.calc-grid{display:grid; grid-template-columns:1fr 1fr; gap:9px; margin:10px 0}
@media(max-width:420px){.calc-grid{grid-template-columns:1fr}}
.calc-field{display:flex; flex-direction:column; gap:4px}
.calc-field label{font-family:var(--mono); font-size:10px; letter-spacing:.1em; text-transform:uppercase; color:var(--mut)}
.calc-field input{background:var(--steel); border:1px solid var(--line2); border-radius:5px; color:var(--ink);
  font-family:var(--mono); font-size:15px; padding:8px 10px; width:100%; -moz-appearance:textfield}
.calc-field input:focus{outline:none; border-color:var(--blue)}
.calc-field input::-webkit-outer-spin-button,.calc-field input::-webkit-inner-spin-button{-webkit-appearance:none}
.calc-out{border:1px solid var(--line2); border-radius:8px; background:var(--panel); padding:12px 14px; margin-top:8px}
.calc-row{display:flex; justify-content:space-between; align-items:baseline; padding:5px 0;
  border-bottom:1px solid rgba(39,50,63,.5); font-size:13px; gap:8px; flex-wrap:wrap}
.calc-row:last-child{border-bottom:none}
.calc-row .ck{color:var(--mut); font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase}
.calc-row .cv{font-family:var(--disp); font-size:17px; color:var(--ink)}
.verdict-chip{display:inline-block; font-family:var(--mono); font-size:11px; letter-spacing:.08em;
  text-transform:uppercase; padding:3px 9px; border-radius:4px; margin-left:6px; vertical-align:middle}
.verdict-chip.cheap{background:rgba(63,185,80,.2); color:var(--green); border:1px solid var(--green)}
.verdict-chip.rich{background:rgba(248,81,73,.2); color:var(--red); border:1px solid var(--red)}
.verdict-chip.fair{background:rgba(255,176,32,.15); color:var(--amber2); border:1px solid var(--amber)}
.mode.ref{border-left-color:var(--purple,#a371f7)} .mode.ref .t{color:#c9a8ff}
/* contract P/L grid (price x time heatmap) + multi-leg payoff */
.grid-wrap{overflow-x:auto; margin-top:10px; -webkit-overflow-scrolling:touch}
.plgrid{border-collapse:collapse; font-family:var(--mono); font-size:10px; margin:0 auto; min-width:100%}
.plgrid th,.plgrid td{border:1px solid rgba(7,11,16,.6); padding:4px 5px; text-align:center; white-space:nowrap}
.plgrid thead th{background:var(--panel2); color:var(--mut); font-size:9.5px; letter-spacing:.06em; position:sticky; top:0}
.plgrid .rowhdr{background:var(--panel2); color:var(--ink); font-weight:700; text-align:right; padding-right:7px}
.plgrid .rowhdr.spot{color:var(--cyan)} .plgrid .cell{color:#0a0e14; font-weight:600}
.plgrid .cell.be{outline:2px dashed var(--amber); outline-offset:-2px}
.plgrid .colcliff{box-shadow:inset 3px 0 0 var(--red), inset -3px 0 0 var(--red)}
.gridlegend{display:flex; flex-wrap:wrap; gap:8px 16px; margin-top:9px; font-family:var(--mono); font-size:10.5px; color:var(--mut)}
.gridlegend b{color:var(--ink)} .gridlegend .sw{display:inline-block; width:12px; height:12px; border-radius:2px; vertical-align:middle; margin-right:4px}
.subtabs{display:flex; gap:6px; margin:0 0 10px; flex-wrap:wrap}
.subtab{font-family:var(--mono); font-size:11px; letter-spacing:.06em; text-transform:uppercase; color:var(--mut);
  background:var(--steel); border:1px solid var(--line2); border-radius:5px; padding:7px 11px; cursor:pointer; transition:.15s}
.subtab.on{color:var(--cyan); border-color:var(--cyan); background:rgba(54,214,231,.08)}
.pnl-pos{color:var(--green)} .pnl-neg{color:var(--red)}
.ml-select{background:var(--steel); border:1px solid var(--line2); border-radius:5px; color:var(--ink);
  font-family:var(--mono); font-size:13px; padding:9px 10px; width:100%}
.payoff-wrap{border:1px solid var(--line2); border-radius:8px; background:var(--panel2); padding:10px; margin-top:10px}
.payoff-wrap svg{display:block; width:100%; height:auto}
</style>
</head>

<script>const BANK = {"meta":{"title":"Options Trading Academy","subtitle":"Mike's path from $6k to out-trading a pro","version":"2.1","modules":[{"id":"foundations","name":"Foundations","blurb":"Calls, puts, strikes, premium, ITM/OTM, exercise & assignment."},{"id":"greeks-iv","name":"Greeks & IV","blurb":"Delta, gamma, theta, vega, implied vol & IV crush."},{"id":"strategy","name":"Strategy Selection","blurb":"Covered calls, CSPs, the wheel, spreads, defined vs undefined risk."},{"id":"risk","name":"Risk & Sizing","blurb":"Sizing a $6k account, max loss, the don't-blow-up rules."},{"id":"entry-exit","name":"Entry / Exit / DTE","blurb":"ITM vs OTM, picking expirations, profit-taking, IV-crush timing."},{"id":"flow","name":"Institutional Flow","blurb":"Sweeps vs blocks, ask-side, OI vs volume, turning flow into YOUR trade."},{"id":"robinhood","name":"Robinhood Mechanics","blurb":"PDT rule, assignment, auto-exercise, buying power, real $6k math."},{"id":"pro-rigor","name":"Pro / Series-7 Rigor","blurb":"Breakeven & max-loss formulas, parity, the licensed-pro vocabulary."},{"id":"payoff","name":"Payoff Diagrams","blurb":"Read the picture — recognize each strategy from its expiration P/L shape."},{"id":"vol-edge","name":"Volatility Edge & Expected Move","blurb":"The straddle price IS the expected move. IV/HV cheap-vs-rich, IV crush, theta back-loading, edge ratio — the test of whether vol is mispriced."},{"id":"management","name":"Managing the Trade","blurb":"Cut the dead leg, scale winners at +50%, breakeven-after-T1, the −50% stop, roll the loser, convert to a butterfly."},{"id":"debate","name":"How the Pros Disagree","blurb":"tastytrade vs SteadyOptions vs SMB vs Option Alpha vs projectfinance — same setup, opposite calls. Learning to reason across the lenses IS the edge."},{"id":"chart-read","name":"Read the Chart","blurb":"Screenshot-in, verdict-out — as practice. Support/resistance, breakout vs chase, pre-earnings IV, exhaustion gaps, and which contract the picture argues for."}],"pro_benchmark":"A licensed equity pro (Series 7) typically nails Foundations, Greeks, Risk and Pro-Rigor (~90%). Your edge is Flow + Robinhood execution — modules a salaried manager rarely trades. Beat the pro THERE.","mastery_note":"v2 adds the advanced tier: Volatility Edge (expected move / IV-HV / crush / theta back-loading), Managing the Trade, and How the Pros Disagree (5-author judgment). Source: straddle-playbook.md."},"questions":[{"id":"opt-001","module":"foundations","level":1,"question":"One standard U.S. equity options contract gives you control over how many shares?","options":["1 share","10 shares","100 shares","1,000 shares"],"correct_index":2,"why":"One contract = 100 shares. So a quoted premium of $2.00 actually costs you $2.00 × 100 = $200. Forgetting the ×100 is the #1 beginner sizing mistake.","tags":["contract","multiplier"],"rh_note":"On Robinhood a '$2.50' call really debits $250 from your $6k. Always multiply by 100 before you think about size."},{"id":"opt-002","module":"foundations","level":1,"question":"Buying a CALL gives you the right to do what?","options":["Sell 100 shares at the strike","Buy 100 shares at the strike","Collect a dividend","Short the stock for free"],"correct_index":1,"why":"A long call = the RIGHT (not obligation) to BUY 100 shares at the strike price up to expiration. You buy calls when you expect the stock to go UP.","tags":["call","rights"]},{"id":"opt-003","module":"foundations","level":1,"question":"Buying a PUT gives you the right to do what?","options":["Buy 100 shares at the strike","Sell 100 shares at the strike","Force a dividend","Lock in margin interest"],"correct_index":1,"why":"A long put = the RIGHT to SELL 100 shares at the strike. Puts gain value when the stock goes DOWN, so they're your bearish bet (or downside insurance).","tags":["put","rights"]},{"id":"opt-004","module":"foundations","level":1,"question":"The price you pay to buy an option is called the…","options":["Strike","Premium","Margin","Spread"],"correct_index":1,"why":"Premium is the option's price. As a BUYER you pay premium (it's your max loss). As a SELLER you collect premium (it's your max gain on that leg).","tags":["premium"]},{"id":"opt-005","module":"foundations","level":1,"question":"The 'strike price' of an option is…","options":["Today's stock price","The fixed price at which the option can be exercised","The premium times 100","The broker's fee"],"correct_index":1,"why":"The strike is the locked-in price you'd buy (call) or sell (put) the 100 shares at if exercised. It never changes for that contract; the stock price moves around it.","tags":["strike"]},{"id":"opt-006","module":"foundations","level":1,"question":"A CALL is 'in the money' (ITM) when…","options":["The stock is below the strike","The stock is above the strike","IV is high","It's expiration day"],"correct_index":1,"why":"A call is ITM when stock > strike (you could buy cheap and sell at market). A put is ITM when stock < strike. ITM options have real intrinsic value; OTM options are pure hope (time + IV).","tags":["ITM","moneyness"]},{"id":"opt-007","module":"foundations","level":2,"question":"Intrinsic value of a call equals…","options":["Premium − strike","max(0, stock price − strike)","Strike − stock price","Premium × delta"],"correct_index":1,"why":"Call intrinsic = max(0, spot − strike); it can't go negative. Everything in the premium ABOVE intrinsic is extrinsic (time + implied-vol) value, which decays to zero by expiration.","tags":["intrinsic","extrinsic"]},{"id":"opt-008","module":"foundations","level":1,"question":"You buy a call. At expiration the stock closes BELOW your strike. What happens?","options":["You profit anyway","The option expires worthless and you lose the premium","You're forced to buy 100 shares","You collect a dividend"],"correct_index":1,"why":"An OTM option at expiration is worthless — you lose 100% of the premium paid, no more, no less. This is exactly why far-OTM 'lottery' calls so often go to zero.","tags":["expiration","worthless"],"rh_note":"This is the homelessness trap in miniature: never put money into a long option that you can't afford to lose entirely."},{"id":"opt-009","module":"foundations","level":1,"question":"What is the maximum a BUYER of a single call or put can lose?","options":["Unlimited","The premium paid","The strike price × 100","Their whole account by law"],"correct_index":1,"why":"A long option's max loss is the premium you paid — that's the whole point of defined risk. Your downside is capped; only SELLERS of naked options face large/unlimited loss.","tags":["max-loss","long"]},{"id":"opt-010","module":"foundations","level":2,"question":"An OTM call has how much intrinsic value?","options":["Zero — it's all time/IV value","Always positive","Equal to the premium","Negative"],"correct_index":0,"why":"OTM options have zero intrinsic value; 100% of their premium is extrinsic (time + implied volatility). That extrinsic value bleeds away every day (theta) and collapses if IV drops.","tags":["OTM","extrinsic"]},{"id":"opt-011","module":"greeks-iv","level":1,"question":"Delta primarily measures…","options":["Time decay per day","How much the option price moves per $1 move in the stock","Sensitivity to interest rates","The bid-ask spread"],"correct_index":1,"why":"Delta = change in option price per $1 move in the underlying. A 0.50 delta call gains ~$0.50/share ($50/contract) if the stock rises $1. Calls have +delta (0→1), puts have −delta (0→−1).","tags":["delta"]},{"id":"opt-012","module":"greeks-iv","level":2,"question":"Your call has a delta of 0.30. The stock rises $1. Roughly how much does the contract gain (ignoring other greeks)?","options":["$0.30","$3","$30","$300"],"correct_index":2,"why":"0.30 delta × $1 × 100 shares = $30 per contract. Delta is per-share; always ×100 for the contract. Higher-delta (ITM) options track the stock more dollar-for-dollar.","tags":["delta","math"]},{"id":"opt-013","module":"greeks-iv","level":2,"question":"Besides price sensitivity, a 0.30 delta is also a rough proxy for…","options":["A 30% chance the option finishes in the money","A 30% return","30 days to expiration","30% implied volatility"],"correct_index":0,"why":"Delta loosely approximates the probability of finishing ITM — a 0.30 call has ~30% odds of expiring in the money. That's why low-delta OTM 'lotto' calls usually expire worthless.","tags":["delta","probability"]},{"id":"opt-014","module":"greeks-iv","level":1,"question":"Theta represents…","options":["Volatility risk","Time decay — value lost per day","Direction","Dividend exposure"],"correct_index":1,"why":"Theta is daily time decay. If you're LONG options, theta is negative — every day that passes without movement bleeds premium. Option sellers WANT theta working for them.","tags":["theta","decay"]},{"id":"opt-015","module":"greeks-iv","level":2,"question":"Theta (time decay) is fastest…","options":["Right after you buy","Evenly across the option's life","In the final ~30 days, especially for at-the-money options","Only on expiration morning"],"correct_index":2,"why":"Decay accelerates into expiration; the last few weeks erode an ATM option's extrinsic value the fastest. Holding short-dated OTM options overnight with no move is how accounts slowly bleed out.","tags":["theta","DTE"]},{"id":"opt-016","module":"greeks-iv","level":2,"question":"Gamma measures…","options":["Time decay","How fast delta itself changes per $1 move","IV sensitivity","Assignment risk"],"correct_index":1,"why":"Gamma = the rate of change of delta. It's highest for ATM options near expiration — that's why 0DTE moves so violently: tiny stock moves swing delta (and your P&L) hard in both directions.","tags":["gamma"]},{"id":"opt-017","module":"greeks-iv","level":2,"question":"Vega measures the option's sensitivity to…","options":["A $1 move in the stock","A 1-point change in implied volatility","One day of time","A 1% interest-rate change"],"correct_index":1,"why":"Vega = price change per 1-point change in implied volatility. Long options have positive vega, so they gain when IV rises and lose when IV falls — the mechanism behind IV crush.","tags":["vega","IV"]},{"id":"opt-018","module":"greeks-iv","level":2,"question":"'IV crush' is…","options":["A stock gapping down","A sharp drop in implied volatility (often right after earnings) that deflates premium","A margin call","A delta spike"],"correct_index":1,"why":"Before earnings, IV (and premium) is pumped up to price the unknown. Once the news is out, IV collapses — your option can LOSE money even if the stock moves your direction, because vega works against you. This is the classic earnings trap.","tags":["IV-crush","earnings"],"rh_note":"Buying single calls/puts right before earnings on RH feels exciting and usually loses to IV crush. Beginners get wrecked here constantly."},{"id":"opt-019","module":"greeks-iv","level":3,"question":"IV Rank / IV Percentile tells you…","options":["The stock's direction","Where current implied vol sits vs its own past range (is option premium cheap or rich now)","The delta","The dividend yield"],"correct_index":1,"why":"IV Rank/Percentile normalizes today's IV against the stock's own history. High IV rank = premium is expensive → favor SELLING premium (spreads/CSPs). Low IV rank = premium cheap → buying long options is less punished by vega.","tags":["IV-rank","vol"]},{"id":"opt-020","module":"greeks-iv","level":3,"question":"You're bullish but IV is very high (expensive premium). A smarter structure than a naked long call is often…","options":["A bigger naked long call","A debit call spread (sell a higher-strike call to offset vega/cost)","A 0DTE far-OTM call","Doing nothing forever"],"correct_index":1,"why":"Buying naked premium into high IV means you're overpaying and exposed to crush. A debit call spread sells some of that rich vega back, lowers your cost and breakeven, and defines risk — at the price of a capped gain.","tags":["IV","spread","vega"]},{"id":"opt-021","module":"strategy","level":2,"question":"A 'covered call' is…","options":["Buying a call with no shares","Owning 100 shares AND selling 1 call against them","Two long calls","A naked short call"],"correct_index":1,"why":"Covered call = long 100 shares + short 1 call. You collect premium (income) in exchange for capping your upside at the strike. Lower risk than the stock alone — the premium cushions small drops.","tags":["covered-call","income"]},{"id":"opt-022","module":"strategy","level":2,"question":"A 'cash-secured put' (CSP) is…","options":["A naked put with no plan","Selling a put while holding enough cash to buy 100 shares if assigned","Buying a put for insurance","A type of call spread"],"correct_index":1,"why":"CSP = short put fully backed by cash to buy the shares at the strike. You get PAID to potentially buy a stock you already like at a lower price. If it's not assigned, you keep the premium as income.","tags":["CSP","income"],"rh_note":"On $6k you can only secure a put where 100 shares (strike × 100) fits your buying power — e.g. a $15 strike needs $1,500 set aside."},{"id":"opt-023","module":"strategy","level":2,"question":"'The wheel' strategy is…","options":["Day-trading 0DTE in a loop","Sell CSP → if assigned, own shares → sell covered calls → repeat","Rolling losses forever","Buying calls and puts together"],"correct_index":1,"why":"The wheel cycles premium income: sell cash-secured puts to get paid (and maybe buy shares cheap), then sell covered calls on those shares to get paid again, repeating. A staple for steady, lower-variance income on stocks you'd be happy to own.","tags":["wheel","income"]},{"id":"opt-024","module":"strategy","level":2,"question":"A debit (vertical) call spread is…","options":["Buying a call and selling a higher-strike call, same expiration","Buying two calls","Selling a naked call","Buying a call and a put"],"correct_index":0,"why":"Buy a lower-strike call, sell a higher-strike call (same expiry). It's cheaper than the naked call, lowers your breakeven, and defines max loss = net debit — but caps your max gain at the spread width.","tags":["debit-spread","vertical"]},{"id":"opt-025","module":"strategy","level":2,"question":"Which of these has UNDEFINED (potentially huge) risk?","options":["Long call","Debit call spread","Naked (uncovered) short call","Cash-secured put"],"correct_index":2,"why":"A naked short call has theoretically unlimited loss — a stock can rise forever. Long calls, spreads, and CSPs all have defined or bounded risk. This is why brokers gate naked calls behind the highest approval level.","tags":["risk","naked-call"]},{"id":"opt-026","module":"strategy","level":2,"question":"You're moderately bullish and want to cut both cost and IV exposure. Best fit?","options":["Far-OTM 0DTE call","Debit call spread","Naked short put","Buy 100 shares only"],"correct_index":1,"why":"A debit call spread gives you defined-risk bullish exposure at a fraction of the naked-call cost and trims vega. You give up unlimited upside (capped at the short strike) in exchange for a cheaper, higher-probability position.","tags":["strategy-match","spread"]},{"id":"opt-027","module":"strategy","level":2,"question":"You want to get PAID while waiting to buy a stock you like at a lower price. Use a…","options":["Long call","Cash-secured put","Covered call","Long straddle"],"correct_index":1,"why":"Selling a cash-secured put pays you premium now; if the stock dips to your strike you buy it (at an effective discount = strike − premium), and if it doesn't, you simply keep the cash. Ideal income tool on names you'd own anyway.","tags":["CSP","strategy-match"]},{"id":"opt-028","module":"strategy","level":3,"question":"A bull PUT spread (credit spread) makes money when…","options":["The stock crashes","The stock stays above your short strike, so you keep the net credit","IV spikes","You get assigned"],"correct_index":1,"why":"Sell a higher-strike put, buy a lower-strike put for protection. You collect a credit and profit if the stock stays ABOVE the short strike at expiration. Defined risk = strike width − credit. A high-probability, theta-positive way to be mildly bullish.","tags":["credit-spread","bull-put"]},{"id":"opt-029","module":"strategy","level":2,"question":"On a small $6k account, the SAFEST way to earn income on a stock you'd happily own is usually…","options":["Naked short calls","A defined-risk credit spread or a cash-secured put you can actually afford","0DTE scalping","Buying long-dated OTM calls"],"correct_index":1,"why":"Defined-risk credit spreads and affordable CSPs cap your downside and pay you premium — exactly what a small account needs. Naked calls (unlimited risk) and 0DTE scalps (high variance) are account-killers on $6k.","tags":["small-account","income"]},{"id":"opt-030","module":"strategy","level":3,"question":"A long straddle (buy a call AND a put at the same strike) profits when…","options":["The stock barely moves","The stock makes a BIG move either direction (more than the combined premium)","IV collapses","Time passes with no move"],"correct_index":1,"why":"A straddle is a bet on volatility/magnitude, not direction — you need a move bigger than both premiums combined to profit. Its enemies are theta and IV crush, so it's a poor 'hold through earnings' play despite feeling clever.","tags":["straddle","volatility"]},{"id":"opt-031","module":"risk","level":2,"question":"On a $6k account, roughly how much should ONE trade be allowed to lose at most (Mike's discipline)?","options":["Whatever it takes","About $100–250 (a small fraction of equity)","$1,500","Half the account"],"correct_index":1,"why":"Sizing every trade as a small fraction of current equity (a hard cap around $100–250 on $6k) means no single loss can cripple you. Survival first — you can't compound an account you blew up.","tags":["sizing","risk-cap"],"rh_note":"This is the core anti-homelessness rule: cap each trade's max loss, then you can be wrong many times and still be in the game."},{"id":"opt-032","module":"risk","level":1,"question":"Putting $1,500 of a $6k account into a single same-day (0DTE) call is…","options":["Smart leverage","Wildly over-sized — 25% of the account at near-total-loss risk","Fine if you feel confident","Required to make money"],"correct_index":1,"why":"That's 25% of your account on a position that can easily go to zero by the close. A couple of those wipes you out. Position size, not conviction, is what keeps you solvent.","tags":["sizing","0DTE"]},{"id":"opt-033","module":"risk","level":1,"question":"The maximum you can lose on a long option position is…","options":["Unlimited","100% of the premium you paid","The strike price","Your whole account"],"correct_index":1,"why":"Long options can lose 100% of premium and no more — so your position size literally equals 'money I'm willing to lose entirely.' Size each long-option trade as if it could go to zero, because it can.","tags":["max-loss","sizing"]},{"id":"opt-034","module":"risk","level":2,"question":"Risking exactly 2% of a $6,000 account on a trade means a max loss of…","options":["$12","$60","$120","$600"],"correct_index":2,"why":"2% × $6,000 = $120. Defining your dollar risk FIRST (then choosing a contract/size that fits it) is how pros size. Most blow-ups come from sizing by excitement instead of by a fixed risk budget.","tags":["sizing","math"]},{"id":"opt-035","module":"risk","level":2,"question":"'Assignment risk' on a short option means…","options":["Your broker closes you randomly","You may be obligated to buy (short put) or deliver (short call) 100 shares","Your delta resets","You lose your premium"],"correct_index":1,"why":"If you SELL an option and it's ITM, the buyer can exercise — you must buy 100 shares (short put) or sell/deliver 100 shares (short call). That's why CSPs need the cash and covered calls need the shares; uncovered, it can force a position you can't afford.","tags":["assignment","short"]},{"id":"opt-036","module":"risk","level":2,"question":"Time decay (theta) hurts you MOST when you…","options":["Sell options","Hold long options that aren't moving, especially short-dated ones","Own shares","Hold a credit spread"],"correct_index":1,"why":"Long options bleed theta daily; the closer to expiration and the more OTM, the faster the bleed. If your thesis needs 'a move soon' and the stock chops sideways, theta quietly eats the position.","tags":["theta","risk"]},{"id":"opt-037","module":"risk","level":1,"question":"When a trade's thesis is clearly invalidated, the disciplined move is to…","options":["Add more (average down) and hope","Cut the loss and protect capital","Hold to expiration no matter what","Double the size"],"correct_index":1,"why":"Capital preservation beats hope. Exiting a broken thesis keeps a small loss small; averaging down on a losing OPTION (with theta/IV decay) usually compounds the damage. Live to trade tomorrow.","tags":["exit","discipline"]},{"id":"opt-038","module":"risk","level":2,"question":"Why do brokers like Robinhood block naked (uncovered) calls for most retail accounts?","options":["It's illegal","Unlimited loss potential — a stock can rise without bound","They don't make fees","It's too simple"],"correct_index":1,"why":"A naked short call's loss is theoretically unlimited (no ceiling on a stock price), so it requires the highest options approval and serious margin. Retail tiers are restricted to defined-risk structures to stop catastrophic blow-ups.","tags":["naked-call","broker"]},{"id":"opt-039","module":"risk","level":3,"question":"Spreading $6k thinly across ten tiny far-OTM 'lottery' calls vs sizing fewer defined-risk trades — the lottery approach mainly…","options":["Guarantees a winner","Maximizes theta/IV bleed and usually drips the account to zero","Reduces risk to nothing","Beats the market"],"correct_index":1,"why":"Many cheap far-OTM calls each have low probability and high theta/IV decay — collectively they tend to bleed out. Concentrating on fewer, higher-probability, defined-risk setups (sized to a fixed risk budget) is far more survivable.","tags":["sizing","lottery"]},{"id":"opt-040","module":"risk","level":2,"question":"The single habit that most protects a small options account from ruin is…","options":["Picking the perfect entry","Strict position sizing / defined risk on every trade","Trading more often","Using the most leverage"],"correct_index":1,"why":"You will be wrong often — everyone is. Consistent small position sizing and defined risk mean being wrong costs you a survivable amount each time. That, not prediction, is what keeps you in the game long enough to win.","tags":["sizing","survival"]},{"id":"opt-041","module":"entry-exit","level":1,"question":"'0DTE' refers to an option that…","options":["Has zero delta","Expires the same trading day","Has zero theta","Is zero-cost"],"correct_index":1,"why":"0DTE = zero days to expiration (expires today). It's almost all gamma and theta: tiny stock moves swing it hard, and what's OTM at the close goes to zero. Thrilling, very high variance, easy to blow up on.","tags":["0DTE","DTE"]},{"id":"opt-042","module":"entry-exit","level":2,"question":"For a directional SWING trade, a common DTE 'sweet spot' that balances cost and theta is…","options":["0–1 days","About 30–45 days","1–2 years","It never matters"],"correct_index":1,"why":"~30–45 DTE gives your thesis time to play out without paying for excessive premium, and theta decay is still moderate (it accelerates hardest inside the final couple weeks). Buys you room to be right without bleeding out fast.","tags":["DTE","swing"]},{"id":"opt-043","module":"entry-exit","level":3,"question":"Compared with an OTM call (delta ~0.30), an ITM call (delta ~0.70) generally…","options":["Costs less and decays faster","Costs more but tracks the stock more 1-for-1, with less theta/IV risk and higher win probability","Has no intrinsic value","Is always the wrong choice"],"correct_index":1,"why":"Higher-delta ITM calls have intrinsic value, move closer to dollar-for-dollar with the stock, carry less extrinsic (so less theta/IV bleed), and have higher odds of finishing ITM. You pay more up front and get less raw leverage, but fewer ways to lose to time and vol.","tags":["ITM","OTM","delta"]},{"id":"opt-044","module":"entry-exit","level":3,"question":"If you want the HIGHEST probability of profit and the LEAST theta/IV risk on a directional bet, lean toward…","options":["Far-OTM short-dated","Slightly ITM, a bit more time","ATM 0DTE","Whatever's cheapest"],"correct_index":1,"why":"Slightly-ITM with a little more DTE maximizes the share of intrinsic value (real, non-decaying) and minimizes the share you can lose to theta and IV crush. It's the 'I want to be right and survive being early' choice.","tags":["ITM","strike-selection"]},{"id":"opt-045","module":"entry-exit","level":2,"question":"Buying single options right BEFORE an earnings release mainly exposes you to…","options":["Lower premium","IV crush after the announcement","Guaranteed gains","Zero risk"],"correct_index":1,"why":"Pre-earnings IV is inflated; after the report IV collapses and premium deflates. You can be right on direction and still lose because vega worked against you. If you must play earnings, defined-risk spreads blunt the crush better than naked long options.","tags":["earnings","IV-crush"]},{"id":"opt-046","module":"entry-exit","level":2,"question":"A sound profit-taking rule for LONG premium (bought calls/puts) is to…","options":["Always hold to expiration","Take profits at a preset target (e.g. +50–100%) rather than squeezing the last dollar","Never sell winners","Sell only at a loss"],"correct_index":1,"why":"Theta and reversals erode unrealized gains fast. Booking profits at a planned target (and cutting losers at a planned stop) turns paper gains into real ones and removes emotion. 'Letting it ride' on a long option often gives it all back.","tags":["exit","profit-taking"]},{"id":"opt-047","module":"entry-exit","level":2,"question":"Holding a still-OTM option into its final week to expiration exposes you mostly to…","options":["Slow, gentle decay","Rapid theta decay — it needs the move NOW or it's worth ~0","Rising value automatically","Lower risk"],"correct_index":1,"why":"In the last week, an OTM option's extrinsic value evaporates quickly; without an immediate move it heads to zero. If you're not in profit and the catalyst hasn't hit, that final week is where most of the loss happens.","tags":["theta","expiration"]},{"id":"opt-048","module":"entry-exit","level":3,"question":"The stock has ALREADY made most of its expected catalyst move. Buying short-dated OTM calls to chase is…","options":["High edge","Late and low-EV — the move is largely priced in and theta/IV now fight you","Risk-free","The pro move"],"correct_index":1,"why":"Chasing after the spike means you buy inflated premium (IV often pumped) right as the easy move is done. You're now paying for a move that's mostly happened, with theta and a likely IV fade working against you. Best entries are BEFORE the crowd, not after.","tags":["entry","chasing"]},{"id":"opt-049","module":"entry-exit","level":2,"question":"To stay directional while CUTTING theta and IV-crush risk, you'd generally…","options":["Go shorter-dated and further OTM","Go slightly ITM and a bit longer-dated","Buy a straddle","Sell a naked call"],"correct_index":1,"why":"More intrinsic value (ITM) + more time (longer DTE) shrinks the fraction of your premium that's exposed to time decay and vega. You trade some leverage and cost for a far more forgiving, survivable directional position.","tags":["strike-selection","ITM"]},{"id":"opt-050","module":"entry-exit","level":2,"question":"A reasonable hard stop discipline on a bought option is to…","options":["Have no stop and hope","Predefine a max loss (e.g. −50% of premium or thesis-break) and exit when hit","Add more at every drop","Only exit at zero"],"correct_index":1,"why":"Deciding your exit BEFORE you enter removes the in-the-moment emotion that turns a small loss into a big one. A predefined stop (a % of premium or 'the thesis broke') keeps each loss inside your risk budget.","tags":["stop","discipline"]},{"id":"opt-051","module":"flow","level":2,"question":"An options 'sweep' is…","options":["A slow limit order","An aggressive order split across multiple exchanges to fill immediately — signals urgency","A dividend capture","A closing trade only"],"correct_index":1,"why":"A sweep takes whatever liquidity is available across exchanges to get filled fast, paying up for immediacy. That urgency is why sweeps are watched as potential 'smart money in a hurry' — though they can still be hedges.","tags":["sweep","flow"]},{"id":"opt-052","module":"flow","level":2,"question":"A 'block' trade is…","options":["A tiny retail order","A single large, often privately negotiated order — sizeable but usually less urgent than a sweep","An expired option","A stock buyback"],"correct_index":1,"why":"Blocks are big single prints, frequently institutional and negotiated. They show conviction by SIZE, but unlike sweeps they aren't screaming 'fill me now.' Reading WHICH kind it is helps you judge urgency.","tags":["block","flow"]},{"id":"opt-053","module":"flow","level":2,"question":"An options trade printing AT or ABOVE the ask ('ask-side') generally suggests…","options":["A seller in control","A buyer-initiated, aggressive order (bullish if it's calls)","A mistake","An assignment"],"correct_index":1,"why":"Paying the ask = the buyer wanted in badly enough to cross the spread, i.e. buyer-initiated aggression. Ask-side CALL buying leans bullish; bid-side selling leans the other way. (Always check it's an opening trade, not a hedge.)","tags":["ask-side","aggression"]},{"id":"opt-054","module":"flow","level":2,"question":"A 'golden sweep' on a flow scanner usually flags…","options":["A small odd lot","An unusually large (often repeated) sweep tagged as high-conviction","A guaranteed winner","A closing-only order"],"correct_index":1,"why":"Golden sweeps are the biggest, most aggressive sweeps — a high-premium urgent bet worth a closer look. High conviction by the prints' size/urgency, but 'high conviction' is not 'guaranteed' — it's a lead, not a signal to copy blindly.","tags":["golden-sweep","flow"]},{"id":"opt-055","module":"flow","level":3,"question":"Open interest (OI) vs volume: which statement is right?","options":["They're the same thing","OI = total contracts outstanding; volume = contracts traded today. Volume >> OI hints at NEW positioning","Volume is always larger","OI resets daily"],"correct_index":1,"why":"Volume is today's activity; OI is the running total of open contracts. When today's volume dwarfs the existing OI at a strike, it signals fresh positioning rather than traders closing — a stronger 'something's happening here' tell.","tags":["OI","volume"]},{"id":"opt-056","module":"flow","level":3,"question":"Why might huge institutional CALL buying NOT actually be a bullish signal to copy?","options":["Institutions are always wrong","It could be a hedge (e.g. against a short stock position) or one leg of a spread — premium size alone doesn't reveal direction","Calls can't be bullish","It's fake data"],"correct_index":1,"why":"A big call print can be a hedge, a spread leg, or a roll — not a naked directional bet. Without seeing the full structure (and the stock position behind it), 'big call buy = bullish' is a trap. Context and trade structure matter more than raw premium.","tags":["hedge","context"]},{"id":"opt-057","module":"flow","level":3,"question":"You see a credible BULLISH flow alert. On a $6k account, the sensible way to follow it is…","options":["Buy the exact same far-OTM lotto contract they did","Take a smaller, defined-risk position — often slightly ITM or a spread, matching or shortening their DTE","Go all-in","Ignore your risk cap"],"correct_index":1,"why":"Institutions have size, hedges, and time you don't. Translate the idea into YOUR account: a smaller, higher-probability, defined-risk expression (slightly ITM or a spread), sized to your risk cap. Copying their exact cheap far-OTM strike usually just donates theta.","tags":["follow-flow","sizing"],"rh_note":"This is your real edge over a salaried equity manager: you can act on retail flow nimbly. Just size it to $100–250 risk and pick a strike that can actually survive being early."},{"id":"opt-058","module":"flow","level":2,"question":"Repeated/persistent flow on the SAME strike across several days suggests…","options":["A glitch","Sustained conviction / accumulation — a stronger tell than a one-off print","Someone must close immediately","Nothing at all"],"correct_index":1,"why":"A single print can be noise or a hedge; the same strike lighting up day after day points to ongoing accumulation or conviction. Persistence is one of the better filters for separating real positioning from one-off prints.","tags":["repeat-flow","conviction"]},{"id":"opt-059","module":"flow","level":2,"question":"The most common mistake retail makes when copying 'unusual options activity' is…","options":["Using too little leverage","Buying cheap far-OTM short-dated calls (lottery tickets) that bleed theta and usually expire worthless","Buying ITM options","Selling spreads"],"correct_index":1,"why":"Retail sees a big bullish print and grabs the cheapest far-OTM weekly to 'leverage' it — exactly the contract with the worst probability and the fastest theta/IV bleed. The pros' edge isn't the strike; it's size, structure, hedging and timing you can't replicate by buying lotto tickets.","tags":["mistake","lottery"]},{"id":"opt-060","module":"flow","level":3,"question":"When deciding ITM vs OTM off a strong bullish flow signal, choosing more ITM (higher delta) mainly buys you…","options":["More theta decay","Higher probability and tighter tracking of the stock, at a higher cost and less raw leverage","Guaranteed profit","Lower cost"],"correct_index":1,"why":"If the flow has real conviction and you want to be PAID for being right (not just gamble on a perfect strike), ITM gives higher odds and less time/vol risk. OTM only wins if the move is big and fast — great when right, but most of the time the ITM choice is the survivable one.","tags":["ITM","OTM","flow"]},{"id":"opt-061","module":"robinhood","level":2,"question":"The Pattern Day Trader (PDT) rule means an account UNDER $25k equity is limited to…","options":["No options at all","About 3 day trades per rolling 5 business days (a 4th flags PDT)","Unlimited day trades","1 trade per month"],"correct_index":1,"why":"Under $25k, more than 3 day trades (open+close same day) in 5 business days triggers a PDT flag and restrictions. On a $6k account this caps how aggressively you can scalp 0DTE — plan swing trades that don't burn day-trade counts.","tags":["PDT","rules"],"rh_note":"RH enforces PDT. Getting flagged can freeze your day-trading for 90 days — a real constraint on a $6k account."},{"id":"opt-062","module":"robinhood","level":2,"question":"Your long call is ITM at expiration but you can't afford to exercise (buy 100 shares). On Robinhood, what typically happens?","options":["Nothing — it just vanishes","RH will generally try to SELL the ITM option for you before close to avoid an exercise you can't cover","You're forced into margin debt automatically with no warning","It converts to a put"],"correct_index":1,"why":"ITM options are auto-exercised by the OCC at expiration if left open. Because exercise needs capital you may not have, RH usually auto-SELLS your ITM long option near the close instead. Don't rely on it though — close ITM options yourself before expiration to stay in control.","tags":["expiration","auto-exercise"]},{"id":"opt-063","module":"robinhood","level":1,"question":"Robinhood's basic options level lets you…","options":["Sell naked calls","Buy calls/puts and run covered positions — but NOT naked calls","Trade futures","Use unlimited margin"],"correct_index":1,"why":"Retail tiers allow long calls/puts, covered calls, and cash-secured puts, but uncovered (naked) calls are restricted because of their unlimited risk. Knowing what your approval level permits stops you from planning trades the platform won't let you place.","tags":["levels","permissions"]},{"id":"opt-064","module":"robinhood","level":2,"question":"To sell a cash-secured put on Robinhood you need…","options":["Nothing — it's free","Enough cash/buying power to buy 100 shares at the strike if assigned","100 shares already","The highest margin tier"],"correct_index":1,"why":"'Cash-secured' literally means RH sets aside strike × 100 in buying power to cover potential assignment. A $20 strike put ties up $2,000. On $6k that limits you to lower-priced underlyings — plan around your actual buying power.","tags":["CSP","buying-power"]},{"id":"opt-065","module":"robinhood","level":1,"question":"A call quoted at $3.00 on Robinhood will debit your account…","options":["$3","$30","$300","$3,000"],"correct_index":2,"why":"$3.00 premium × 100 shares = $300. Robinhood shows the per-share premium; the contract costs 100×. On a $6k account that single contract is already 5% of your capital at risk — size accordingly.","tags":["premium","math"]},{"id":"opt-066","module":"robinhood","level":3,"question":"'Early assignment' on a short equity option can happen…","options":["Only at expiration","Any time before expiration — equity options are American-style (notably around ex-dividend for short calls, or when deep ITM)","Never on Robinhood","Only on index options"],"correct_index":1,"why":"U.S. equity options are American-style, so a short option can be assigned ANY day it's ITM — especially short calls right before an ex-dividend date, or deep-ITM options. If you sell options, early assignment is a real risk you must be able to cover.","tags":["early-assignment","American"]},{"id":"opt-067","module":"robinhood","level":2,"question":"If you sold an option and can't afford to be assigned 100 shares, the right move before expiration is to…","options":["Ignore it and hope","Buy the option back (close it) before it's assigned","Turn off your phone","Let it assign and sort it out later"],"correct_index":1,"why":"Closing (buying back) a short option removes the assignment obligation entirely. Waiting and hoping risks being forced into a 100-share position your $6k can't cover, possibly triggering a margin call or forced liquidation.","tags":["assignment","close"]},{"id":"opt-068","module":"robinhood","level":2,"question":"Aggressively day-trading options on a $6k Robinhood account risks TWO account-killers at once:","options":["Taxes and fees","Hitting the PDT day-trade limit AND blowing up through oversizing","Dividends and splits","Wash sales and audits"],"correct_index":1,"why":"Frequent same-day options trades both burn your limited PDT day-trade count (under $25k) and tempt oversized, high-variance bets. Either can end the account — together they're why disciplined swing/defined-risk trading suits a small account far better.","tags":["PDT","sizing"]},{"id":"opt-069","module":"pro-rigor","level":2,"question":"Breakeven at expiration for a LONG CALL is…","options":["Strike − premium","Strike + premium paid","Premium × 100","Strike only"],"correct_index":1,"why":"A long call only nets a profit once the stock clears strike + premium. Example: $50 strike, $2 premium → breakeven $52. Knowing breakeven before you enter tells you how big a move you actually need.","tags":["breakeven","call"]},{"id":"opt-070","module":"pro-rigor","level":2,"question":"Breakeven at expiration for a LONG PUT is…","options":["Strike + premium","Strike − premium paid","Premium ÷ delta","The stock price"],"correct_index":1,"why":"A long put profits below strike − premium. Example: $50 strike, $2 premium → breakeven $48; the stock must fall past $48 for you to net a gain. Mirror image of the call breakeven.","tags":["breakeven","put"]},{"id":"opt-071","module":"pro-rigor","level":2,"question":"Maximum loss on a NAKED (uncovered) short put is…","options":["The premium received","Roughly (strike − premium) × 100, if the stock goes to zero","Unlimited","Zero"],"correct_index":1,"why":"A short put's worst case is the stock falling to $0: you're obligated to buy at the strike, losing (strike − premium) per share × 100. Large but finite (unlike a naked call's unlimited risk). This is the real exposure behind 'getting paid to buy.'","tags":["max-loss","short-put"]},{"id":"opt-072","module":"pro-rigor","level":3,"question":"On a DEBIT call spread, maximum gain equals…","options":["Unlimited","(Strike width − net debit) × 100","The net debit","The premium of the long leg"],"correct_index":1,"why":"Max gain = the distance between strikes minus what you paid, ×100; max loss = the net debit. Example: buy 50 / sell 55 for $2 → max gain (5 − 2)×100 = $300, max loss $200. Defined on both ends — that's the appeal.","tags":["debit-spread","max-gain"]},{"id":"opt-073","module":"pro-rigor","level":3,"question":"Put-call parity describes the fixed relationship between…","options":["Delta and theta","A call, a put, the stock, and the strike (C − P = S − PV(K))","IV and HV","Volume and OI"],"correct_index":1,"why":"Put-call parity (C − P = S − present value of strike) ties same-strike/expiry calls, puts and the stock together; arbitrage keeps them aligned. It's the backbone fact behind synthetic positions and why mispriced legs get arbed away fast.","tags":["parity","arbitrage"]},{"id":"opt-074","module":"pro-rigor","level":1,"question":"An option's total premium is always made of…","options":["Just intrinsic value","Intrinsic value + extrinsic (time + IV) value","Just time value","Delta + gamma"],"correct_index":1,"why":"Premium = intrinsic (real, exercise value) + extrinsic (time + implied-volatility value). At expiration extrinsic = 0, so only intrinsic remains. Understanding the split tells you how much of your price is 'real' vs 'decaying.'","tags":["premium","intrinsic-extrinsic"]},{"id":"opt-075","module":"pro-rigor","level":2,"question":"U.S. single-stock equity options are generally ___-style, while many broad index options are ___-style.","options":["European; American","American; European","American; American","European; European"],"correct_index":1,"why":"Equity options are American (exercisable any time before expiry → early-assignment risk). Many index options (e.g. SPX) are European (exercise only at expiration, cash-settled). The style changes your assignment and settlement risk.","tags":["american","european"]},{"id":"opt-076","module":"pro-rigor","level":3,"question":"Maximum gain on a covered call (long 100 shares + short 1 call) is…","options":["Unlimited","(Strike − stock cost + premium) × 100 — upside capped above the strike","Just the premium","The stock price × 100"],"correct_index":1,"why":"Selling the call caps your upside: best case the stock finishes at/above the strike and you make (strike − your cost + premium) ×100. You trade unlimited upside for premium income and a small downside cushion — the classic income tradeoff.","tags":["covered-call","max-gain"]},{"id":"opt-077","module":"pro-rigor","level":3,"question":"On a covered call, your downside breakeven on the shares is…","options":["The strike price","Stock purchase price − premium received","Strike + premium","Zero"],"correct_index":1,"why":"The premium you collected lowers your effective cost: breakeven = what you paid for the shares minus the call premium. Below that you're net losing on the position — the premium only cushions a limited drop, it doesn't fully protect you.","tags":["covered-call","breakeven"]},{"id":"opt-078","module":"pro-rigor","level":2,"question":"Maximum gain on a long call vs maximum loss on a long call:","options":["Both unlimited","Max gain theoretically unlimited; max loss = premium paid","Both equal the premium","Max gain = strike; max loss = unlimited"],"correct_index":1,"why":"A long call's upside is theoretically unlimited (no ceiling on the stock) while its downside is capped at the premium. That asymmetric payoff — small defined risk, large potential reward — is the core reason traders buy calls.","tags":["max-gain","max-loss","call"]},{"id":"opt-079","module":"greeks-iv","level":3,"question":"Vega (sensitivity to IV) is LARGEST for which options?","options":["Deep ITM, short-dated","At-the-money, longer-dated","Far OTM, expiring today","It's the same for all"],"correct_index":1,"why":"ATM options with more time to expiration have the most extrinsic value, so they react most to IV changes. That's why a longer-dated ATM straddle is essentially a pure volatility bet.","tags":["vega","iv"]},{"id":"opt-080","module":"greeks-iv","level":3,"question":"As an ATM option approaches expiration, its gamma generally…","options":["Falls to zero","Spikes sharply higher","Stays flat","Turns negative"],"correct_index":1,"why":"Gamma concentrates near the strike as time runs out — tiny moves flip the option between OTM and ITM, so delta swings violently. This is exactly why 0DTE ATM options are so explosive (and dangerous).","tags":["gamma","dte"]},{"id":"opt-081","module":"greeks-iv","level":3,"question":"Rho (interest-rate sensitivity) matters most for…","options":["0DTE options","Long-dated options / LEAPS","Far-OTM weeklies","Covered calls"],"correct_index":1,"why":"Rho grows with time to expiration, so it's only really meaningful on long-dated options (LEAPS). For the weeklies/monthlies most retail traders use, rho is a rounding error vs delta/theta/vega.","tags":["rho","leaps"]},{"id":"opt-082","module":"greeks-iv","level":2,"question":"If a stock's implied volatility (IV) is much HIGHER than its recent realized/historical volatility (HV), options are…","options":["Cheap relative to actual movement","Expensive — the market is pricing more movement than has been happening","Free of theta","Guaranteed to fall"],"correct_index":1,"why":"IV >> HV means the market is charging up premium for expected (often event-driven) movement. Buying then is paying up; it favors premium SELLERS unless you expect the move to exceed what's priced.","tags":["iv","hv"]},{"id":"opt-083","module":"strategy","level":2,"question":"A LEAPS call is…","options":["A 0DTE call","A long-dated call (typically >1 year out)","A naked call","A call on leveraged ETFs only"],"correct_index":1,"why":"LEAPS = Long-term Equity AnticiPation Securities: options expiring far out (often 1-2+ years). A deep-ITM LEAPS call acts like owning the stock with less capital and slower daily theta — a 'stock replacement.'","tags":["leaps"]},{"id":"opt-084","module":"strategy","level":3,"question":"An iron condor makes money when…","options":["The stock makes a huge move","The stock stays within a range between the short strikes","IV explodes higher","It always loses"],"correct_index":1,"why":"An iron condor sells an OTM put spread AND an OTM call spread — you collect credit and profit if the stock stays range-bound between the short strikes. Defined risk on both wings; it's a theta-positive, low-volatility bet.","tags":["iron-condor","range"]},{"id":"opt-085","module":"strategy","level":3,"question":"A calendar (time) spread profits mainly from…","options":["A big directional move","The faster time-decay of the near-dated short option vs the longer-dated long option","Rising interest rates","Assignment"],"correct_index":1,"why":"Sell a near-dated option, buy a longer-dated one at the same strike. The short leg decays faster (more theta), and the position also gains if IV rises. Best when the stock sits near the strike as the front month expires.","tags":["calendar","theta"]},{"id":"opt-086","module":"strategy","level":2,"question":"'Rolling' an option means…","options":["Doubling your size","Closing the current option and opening a new one (later date and/or different strike) to extend or adjust","Exercising early","Converting to stock"],"correct_index":1,"why":"A roll is one combined adjustment: buy-to-close the existing contract and sell/buy-to-open a new expiration or strike. Traders roll to give a thesis more time, take in more credit, or move a tested short strike away.","tags":["roll"]},{"id":"opt-087","module":"strategy","level":2,"question":"A protective put is…","options":["Selling a put for income","Owning stock AND buying a put as downside insurance","Two short puts","A naked call"],"correct_index":1,"why":"Long stock + long put sets a floor: below the put's strike your losses stop (minus the premium paid). It's literally insurance on a position you want to keep — you pay premium for peace of mind.","tags":["protective-put","hedge"]},{"id":"opt-088","module":"strategy","level":3,"question":"A 'collar' on a stock position is…","options":["Long stock + long put + short call","Two long calls","A naked straddle","Long stock only"],"correct_index":0,"why":"A collar finances the protective put by selling a covered call above the price: long stock + long put (floor) + short call (ceiling). You cap upside to pay for downside protection — popular for protecting big gains cheaply.","tags":["collar","hedge"]},{"id":"opt-089","module":"risk","level":1,"question":"'Defined-risk' trade means…","options":["You can't lose","Your maximum loss is known and capped the moment you enter","No theta","Guaranteed profit"],"correct_index":1,"why":"Defined-risk structures (long options, debit/credit spreads) have a max loss you can calculate before entering — so you can size to it. Undefined-risk trades (naked calls/puts) can lose far more than you planned. Small accounts should live in defined-risk.","tags":["defined-risk"]},{"id":"opt-090","module":"risk","level":2,"question":"Why should you almost always use a LIMIT order (not a market order) when trading options?","options":["Limit orders are free","Option bid-ask spreads are often wide — a market order can fill at a terrible price","Market orders are banned","It avoids assignment"],"correct_index":1,"why":"Options frequently have wide bid-ask spreads and thin liquidity; a market order can fill well away from fair value, quietly costing you real money on entry AND exit. Always set a limit (often near the mid).","tags":["limit-order","execution"],"rh_note":"On Robinhood, tap to set a limit price near the mid instead of 'market'. On a $6k account, a bad fill on a wide spread can cost you several percent before the trade even moves."},{"id":"opt-091","module":"risk","level":2,"question":"The 'probability of profit' (POP) on a far-OTM long call is generally…","options":["Very high","Low — most far-OTM long calls expire worthless","Exactly 50%","Guaranteed"],"correct_index":1,"why":"Far-OTM calls are cheap precisely because they're unlikely to pay off — low delta ≈ low odds of finishing ITM. They feel like leverage but most expire worthless; the occasional big winner rarely covers the steady stream of zeros.","tags":["pop","otm"]},{"id":"opt-092","module":"risk","level":3,"question":"A trade that risks $200 to make $100 (2:1 against you) needs roughly what WIN RATE just to break even?","options":["About 33%","About 50%","About 67%","About 10%"],"correct_index":2,"why":"Break-even win rate p solves p×100 = (1−p)×200 → p ≈ 0.67. When your reward is smaller than your risk, you must win MORE often than you lose just to stay flat. Risk/reward and win rate are two halves of the same edge.","tags":["risk-reward","expectancy"]},{"id":"opt-093","module":"entry-exit","level":2,"question":"You hold an ITM long call you want to exit. Usually it's better to…","options":["Exercise it early","Sell-to-close (capture the remaining time value instead of forfeiting it)","Let it expire","Roll it forever"],"correct_index":1,"why":"Exercising early throws away any remaining extrinsic (time) value — you only get intrinsic. Selling-to-close captures intrinsic PLUS whatever time value is left, and needs no capital to buy 100 shares. Exercise is rarely the right retail move.","tags":["sell-to-close","exercise"]},{"id":"opt-094","module":"entry-exit","level":3,"question":"'Pin risk' refers to…","options":["A stock gapping overnight","Uncertainty when the stock sits right AT your strike into expiration (will it be assigned or not?)","A margin call","High theta"],"correct_index":1,"why":"If the underlying closes almost exactly on your strike at expiration, you can't be sure whether a short option gets assigned — you may wake up with (or without) an unexpected 100-share position. Close pinned short options before the close to avoid the coin-flip.","tags":["pin-risk","assignment"]},{"id":"opt-095","module":"entry-exit","level":2,"question":"Before buying an option, a key LIQUIDITY check is…","options":["Pick the cheapest premium","Prefer tight bid-ask spreads and high open interest/volume so you can exit easily","Only trade 0DTE","Ignore the spread"],"correct_index":1,"why":"An option you can't sell at a fair price is a trap. Tight spreads + healthy OI/volume mean you can get OUT near fair value. Illiquid contracts (wide spread, tiny OI) can cost you a chunk just to exit — check liquidity before you enter.","tags":["liquidity","oi"]},{"id":"opt-096","module":"entry-exit","level":2,"question":"For the SAME bullish thesis, a 0DTE call vs a 45-DTE call mainly differs in that 0DTE…","options":["Is always safer","Needs the move to happen TODAY — extreme gamma and theta, little room to be early","Has no theta","Costs more"],"correct_index":1,"why":"0DTE is all-or-nothing intraday: huge gamma (violent swings) and brutal theta (it's worthless by close if OTM). 45-DTE gives your thesis weeks to play out with gentler decay. Same direction, totally different risk — pick the DTE that matches your timing confidence.","tags":["dte","0dte"]},{"id":"opt-097","module":"flow","level":3,"question":"A large PUT sweep printing ask-side could mean…","options":["Definitely bearish, copy it","A bearish bet OR downside hedging/protection — check the context before assuming direction","A data error","The stock will rise"],"correct_index":1,"why":"Aggressive put buying can be a directional short OR portfolio insurance against longs. Like big call prints, a single put sweep doesn't reveal intent by itself — size, repetition, the stock's setup, and whether it's opening all matter before you read it as 'bearish.'","tags":["puts","hedge","flow"]},{"id":"opt-098","module":"flow","level":2,"question":"Heavy unusual activity in WEEKLY options vs in LEAPS tends to signal…","options":["Exactly the same thing","Weeklies = a near-term catalyst/gamma play; LEAPS = longer-term positioning or hedging","Weeklies are always wrong","LEAPS are illiquid junk"],"correct_index":1,"why":"Short-dated weekly flow usually keys on an imminent catalyst (earnings, event, momentum). Big LEAPS flow points to longer-horizon conviction or hedging. The expiration the smart money chose tells you their TIME FRAME — match yours to it.","tags":["weeklies","leaps","flow"]},{"id":"opt-099","module":"robinhood","level":2,"question":"To trade a multi-leg spread (e.g. a debit call spread) on Robinhood you generally need…","options":["No approval at all","Level 3 options approval, and both legs fill together as one order","A margin loan","100 shares first"],"correct_index":1,"why":"Spreads require higher options approval (Level 3) because they involve a short leg. RH submits both legs as a single combo order at a net debit/credit, so you're not legging in one side at a time. Apply for the level before you plan spread trades.","tags":["levels","spreads"]},{"id":"opt-100","module":"robinhood","level":2,"question":"On Robinhood, the buying power a LONG option ties up equals…","options":["Nothing","The premium paid (×100); a spread ties up its net debit / defined max loss","The strike price","Your whole account"],"correct_index":1,"why":"A long option costs (and reserves) its premium × 100. A defined-risk spread only ties up its net debit (its max loss), which is why spreads are so capital-efficient on a small account vs buying the naked long option outright.","tags":["buying-power","spreads"]},{"id":"opt-101","module":"payoff","level":2,"question":"Which strategy does this expiration payoff diagram show?","svg":"<svg viewBox=\"0 0 320 196\" width=\"100%\" role=\"img\" aria-label=\"payoff diagram\" style=\"max-width:340px;display:block;margin:2px auto 0;background:rgba(7,11,16,.5);border:1px solid #27323f;border-radius:8px\"><line x1=\"50\" y1=\"22\" x2=\"50\" y2=\"166\" stroke=\"#324252\" stroke-width=\"1\"/><line x1=\"50\" y1=\"114.2\" x2=\"304\" y2=\"114.2\" stroke=\"#56657a\" stroke-width=\"1\" stroke-dasharray=\"2 3\"/><line x1=\"162.9\" y1=\"22\" x2=\"162.9\" y2=\"166\" stroke=\"#324252\" stroke-width=\"1\" stroke-dasharray=\"3 3\"/><polyline points=\"50.0,150.2 53.2,150.2 56.4,150.2 59.5,150.2 62.7,150.2 65.9,150.2 69.0,150.2 72.2,150.2 75.4,150.2 78.6,150.2 81.8,150.2 84.9,150.2 88.1,150.2 91.3,150.2 94.4,150.2 97.6,150.2 100.8,150.2 104.0,150.2 107.2,150.2 110.3,150.2 113.5,150.2 116.7,150.2 119.9,150.2 123.0,150.2 126.2,150.2 129.4,150.2 132.6,150.2 135.7,150.2 138.9,150.2 142.1,150.2 145.2,150.2 148.4,150.2 151.6,150.2 154.8,150.2 157.9,150.2 161.1,150.2 164.3,149.1 167.5,146.6 170.6,144.1 173.8,141.5 177.0,139.0 180.2,136.5 183.3,133.9 186.5,131.4 189.7,128.9 192.9,126.3 196.0,123.8 199.2,121.3 202.4,118.8 205.6,116.2 208.8,113.7 211.9,111.2 215.1,108.6 218.3,106.1 221.5,103.6 224.6,101.0 227.8,98.5 231.0,96.0 234.2,93.4 237.3,90.9 240.5,88.4 243.7,85.8 246.8,83.3 250.0,80.8 253.2,78.2 256.4,75.7 259.5,73.2 262.7,70.7 265.9,68.1 269.1,65.6 272.2,63.1 275.4,60.5 278.6,58.0 281.8,55.5 285.0,52.9 288.1,50.4 291.3,47.9 294.5,45.3 297.6,42.8 300.8,40.3 304.0,37.8\" fill=\"none\" stroke=\"#36d6e7\" stroke-width=\"2.5\" stroke-linejoin=\"round\" stroke-linecap=\"round\"/><text x=\"47\" y=\"26\" fill=\"#8593a1\" font-size=\"9\" font-family=\"monospace\" text-anchor=\"end\">+P/L</text><t
