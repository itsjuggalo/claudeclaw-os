<!doctype html>
<html lang="en" data-theme="graphite">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no" />
    <link rel="icon" type="image/svg+xml" href="/favicon.svg" />
    <meta name="referrer" content="no-referrer" />
    <title>Mission Control · ClaudeClaw</title>
    <script>
      // Apply theme before render to avoid FOUC.
      try {
        const saved = localStorage.getItem('claudeclaw.theme');
        if (saved === 'midnight' || saved === 'crimson' || saved === 'graphite') {
          document.documentElement.setAttribute('data-theme', saved);
        }
      } catch {}
      // Apply forced-desktop viewport before first paint so the browser
      // computes its auto-fit scale against the wide layout viewport.
      // Width is multiplied by uiScale to compensate for the CSS zoom
      // theme.ts applies on <html> (see web/src/lib/view-mode.ts).
      try {
        if (localStorage.getItem('claudeclaw.viewMode') === 'desktop') {
          var s = parseFloat(localStorage.getItem('claudeclaw.uiScale') || '1');
          if (!(s >= 0.8 && s <= 1.6)) s = 1;
          document.querySelector('meta[name="viewport"]')
            .setAttribute('content', 'width=' + Math.round(1100 * s) + ', user-scalable=yes');
        }
      } catch {}
    </script>
  </head>
  <body>
    <div id="app"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
